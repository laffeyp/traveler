# Handoff gaps this bundle does not close.

handoffs:
  - id: handoff-E
    boundary: Physical Presence
    questions_from: specs/ui-surface-design/ui-surface-design-spec-v0.3.md#22
    related_blackboard: B-Q-33
    seen_on:
      - handheld/ScanInventoryView.dc.html
      - handheld/InstallInventoryView.dc.html
    candidate_operations:
      - PresentInventoryAtStation
      - ScanPhysicalItem
      - BindPresentedItemToRunStep
      - RejectPresentedItem
      - ClearPresentedItem
      - TimeoutPresentation
    candidate_records:
      - Station
      - Presentation

  - id: handoff-F
    boundary: Part and Inspection Requirement
    questions_from: specs/ui-surface-design/ui-surface-design-spec-v0.3.md#23
    related_blackboard: [B-Q-31, B-Q-32]
    seen_on:
      - handheld/RunStepView.dc.html
      - handheld/MeasurementCaptureView.dc.html
      - mac/SupplierEvidenceChecklist.dc.html
    candidate_records:
      - Part
      - PartRevision
      - Drawing
      - MaterialSpecification
      - InspectionRequirement
      - InspectionRequirementVersion

# Token pointers. The implementer reads token names from the token
# artboards; this section names which token maps to which purpose.

tokens_summary:
  ground: "#FAFAF7"
  fill_weak: "#F0EDDF"
  rule: "#D9D6CE"
  ink_primary: "#1A1A1A"   # 17:1 AAA
  ink_secondary: "#4A4A4A" # 9.4:1 AAA
  ink_tertiary: "#6B6B6B"  # 5.5:1 AA-large
  amber: "#B45309"         # pending, waiting, deferred
  red: "#B00020"           # refusal, hard fail
  blue: "#1E4E8C"           # informational, focus ring
  green: "#2D6A3C"          # load-bearing success only
  type_pairing:
    display: "IBM Plex Sans"
    body: "IBM Plex Sans"
    mono: "IBM Plex Mono"
  minimum_body_px:
    handheld: 15
    mac: 12
  tap_target_pt:
    handheld_min: 48
    handheld_primary: 56
    mac_default: 30

