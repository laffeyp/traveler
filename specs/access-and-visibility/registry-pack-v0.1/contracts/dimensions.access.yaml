  - name: report_type
    source: target
    type: enum_from_reports_registry
    default_posture: profile_whitelist
    sprint_delivered: 040

  - name: support_admin_context
    source: caller
    type: support_session_reference
    default_posture: null
    sprint_delivered: 041
    note: "resolves to a SupportSession record whose state, scope, and time_window are evaluated"

  - name: service_account_scope
    source: caller_type_declaration
    type: struct
    fields: [processing_actions, disclosure_actions]
    default_posture: empty
    sprint_delivered: 042
    note: "B-Q-77 candidate: fields on caller_type declaration, not a record"
