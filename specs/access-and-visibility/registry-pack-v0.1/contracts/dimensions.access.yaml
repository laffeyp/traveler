    source: caller
    type: enum
    values: [manufacturing_engineer, operator, planner, quality_engineer, quality_inspector, system_worker, adapter, machine_integration_owner, access_admin, service_account, support_user, external_viewer]
    default_posture: from_authorization_rule
    sprint_delivered: already
    note: "ten types registered; external_viewer added in sprint 034 for customer profiles; quality_inspector added if the mapping demands it (currently absorbed into quality_engineer)"

  - name: access_group
    source: caller
    type: string_list
    default_posture: empty
    sprint_delivered: 035
    note: "B-Q-74 candidate: caller-context field, not a record"

  - name: customer
    source: caller_and_record
    type: string
    default_posture: null_matches_default_profile
    sprint_delivered: 036
    note: "B-Q-75 candidate: on Shipment, ShipmentLine, GeneratedReport (no Order record)"

  - name: program
    source: caller_and_record
    type: string
    default_posture: null_matches_default_profile
    sprint_delivered: 037

  - name: contract
    source: caller_and_record
    type: string
    default_posture: null_matches_default_profile
    sprint_delivered: 038
    note: "B-Q-76 candidate: on Shipment, GeneratedReport, not on Run"

  - name: factory_node
    source: caller_and_record
    type: string
    default_posture: null_matches_default_profile
    sprint_delivered: 039

  - name: record_type
    source: target
    type: enum_from_records_registry
    default_posture: profile_whitelist
    sprint_delivered: 040

  - name: controlled_data_classification
    source: target
    type: enum
    values: [export_controlled, customer_confidential, supplier_confidential, internal_quality, controlled_technical_data, public_summary, none]
    default_posture: none
    sprint_delivered: 031
