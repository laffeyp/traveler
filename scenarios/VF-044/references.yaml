scenario_id: VF-044
scenario_version: "1"
registry_version: contracts-0.4.1
source: >
  Physical Presence Boundary, boundary-spec-v0.10 §13.7. Two-path scenario: receiving_review permits a
  quarantined child; production_install refuses (the invariant fires first because a receiving_review
  presentation is already active).

operations:
  - RegisterStation
  - CreateInventoryItem
  - ReceiveInventory
  - QuarantineInventory
  - PresentInventoryAtStation

events:
  - STATION_REGISTERED
  - INVENTORY_CREATED
  - INVENTORY_RECEIVED
  - INVENTORY_QUARANTINED
  - INVENTORY_PRESENTED_AT_STATION

record_states:
  Station: [active]
  Presentation: [presented]
  InventoryItem: [expected, received, quarantined]

assertion_types:
  - record_state
  - operation_failed

caller_types: [planner, quality_engineer, operator]
