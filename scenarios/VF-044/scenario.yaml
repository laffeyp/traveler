scenario_id: VF-044
scenario_version: "1"
title: receiving_review permits quarantined; production_install refuses
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove the §12.3 gate matrix's row for quarantined. A planner presents a quarantined child at the receiving
  station under presentation_purpose: receiving_review; the presentation succeeds. An operator then presents
  the same child at an assembly station under production_install; the second presentation refuses
  inventory_quarantined. Both paths against the same quarantined InventoryItem.

seed:
  deterministic_seed: 3044

clock:
  start_at: "2026-08-28T14:00:00Z"
  timezone: "UTC"
  mode: controlled

actors:
  - { actor_id: planner_1,  actor_type: planner,          product_caller_type: planner }
  - { actor_id: quality_1,  actor_type: quality_engineer, product_caller_type: quality_engineer }
  - { actor_id: operator_1, actor_type: operator,         product_caller_type: operator }

aliases:
  child_001: InventoryItem
  station_a: Station
  station_receiving: Station
  receiving_presentation: Presentation

world:
  factory_node: hq_a
  part_revisions:
    - { alias: child_rev_a, part_number: CA-200, revision: A }
  inventory_truth:
    - { alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }

steps:
  - { step_id: "001", actor: planner_1, operation: RegisterStation, idempotency_key: vf044-001, input: { station_alias: station_a, station_type: assembly, factory_node_id: hq_a }, expect: { operation_succeeded: true, events_emitted: [STATION_REGISTERED] } }
  - { step_id: "002", actor: planner_1, operation: RegisterStation, idempotency_key: vf044-002, input: { station_alias: station_receiving, station_type: receiving, factory_node_id: hq_a }, expect: { operation_succeeded: true, events_emitted: [STATION_REGISTERED] } }
  - { step_id: "003", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf044-003, input: { inventory_alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "004", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf044-004, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "005", actor: quality_1, operation: QuarantineInventory, idempotency_key: vf044-005, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }
  # Receiving-review presentation succeeds against the quarantined child
  - { step_id: "030", actor: planner_1, operation: PresentInventoryAtStation, idempotency_key: vf044-030, input: { presentation_alias: receiving_presentation, inventory_item_alias: child_001, station_alias: station_receiving, actor_id: planner_1, caller_type: planner, presentation_purpose: receiving_review, intended_operation: RunReceivingCheck, scan_value: "InventoryItem:child_001", scan_type: presence_asserting, presentation_source: fixture_seed, presented_at: "2026-08-28T14:12:00Z", expires_at: "2026-08-28T14:22:00Z" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_PRESENTED_AT_STATION] } }
  # Production-install presentation on the same quarantined item refuses at emit (invariant: one active presentation)
  # blocks the write; the production purpose then refuses with inventory_quarantined
  - { step_id: "031", actor: operator_1, operation: PresentInventoryAtStation, idempotency_key: vf044-031, input: { presentation_alias: production_presentation, inventory_item_alias: child_001, station_alias: station_a, actor_id: operator_1, caller_type: operator, presentation_purpose: production_install, intended_operation: InstallInventory, scan_value: "InventoryItem:child_001", scan_type: presence_asserting, presentation_source: fixture_seed, presented_at: "2026-08-28T14:13:00Z", expires_at: "2026-08-28T14:23:00Z" }, expect: { operation_succeeded: false } }

assertions:
  - { assertion_id: vf044_receiving_succeeded, assertion_type: record_state, severity: blocking, target: { alias: receiving_presentation }, expected: { state: presented } }
  - { assertion_id: vf044_production_refused, assertion_type: operation_failed, severity: blocking, target: { step_id: "031", operation: PresentInventoryAtStation }, expected: { failure_class: inventory_quarantined } }
