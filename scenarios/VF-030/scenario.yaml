scenario_id: VF-030
scenario_version: "1"
title: A heat-treated part without its process certificate does not reach the floor
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  boundary_spec: Receiving Evidence Boundary Specification v0.1 (§20 VF-030)
  registry_version: contracts-0.4.1

purpose: >
  The boundary specification's §20, and the last of its seven scenarios. A part that went through a special
  process at the supplier — heat treat here, but plating, welding and non-destructive test behave the same —
  arrives with its certificate of conformance and its mill certificate, and without the certificate for the
  process itself. Two of three documents are in order, and the consignment is still refused.

  The process certificate is scoped to the LOT, not the part revision, and that is the substantive difference
  from the first article report in VF-027. A first article covers a design: certify it once and every later
  lot of that revision inherits it. A furnace load does not work that way — two lots of the same revision go
  through different heat treat cycles, so a certificate for one says nothing about the other. The scenario
  proves that by capturing a process certificate for a DIFFERENT lot of the same revision and showing it does
  not satisfy the requirement.

seed: { deterministic_seed: 3031 }
clock: { start_at: "2026-07-12T08:00:00Z", timezone: "UTC", mode: controlled }

world:
  factory_node: node_la_001
  station: station_receiving_01
  program: program_valve_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_050, part_revision: valve_body_rev_a, serial_number: VB-050 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }

steps:
  - { step_id: "001", set_time: "2026-07-12T08:00:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf030-001, input: { inventory_alias: valve_body_050, part_revision: valve_body_rev_a, serial_number: "VB-050" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "002", actor: planner_1, operation: CreateShipment, idempotency_key: vf030-002, input: { shipment_alias: shipment_001, supplier: supplier_acme, purchase_order_ref: "PO-8300" }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_CREATED] } }
  - { step_id: "003", actor: planner_1, operation: AddShipmentLine, idempotency_key: vf030-003, input: { shipment_alias: shipment_001, shipment_line_alias: line_001, inventory_item_alias: valve_body_050, part_revision: valve_body_rev_a, serial_or_lot: "VB-050", required_documents: [certificate_of_conformance, material_test_report, process_certificate] }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_LINE_CREATED] } }
  - { step_id: "004", set_time: "2026-07-12T08:10:00Z", actor: planner_1, operation: ReceiveShipment, idempotency_key: vf030-004, input: { shipment_alias: shipment_001 }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_RECEIVED] } }
  - { step_id: "005", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf030-005, input: { inventory_alias: valve_body_050 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "006", set_time: "2026-07-12T08:15:00Z", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf030-006, input: { certificate_alias: coc_050, cert_type: certificate_of_conformance, part_revision: valve_body_rev_a, serial_or_lot: "VB-050", cage_code: "1ABC2", expires_at: "2027-06-01T00:00:00Z" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  - { step_id: "007", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf030-007, input: { certificate_alias: mtr_050, cert_type: material_test_report, part_revision: valve_body_rev_a, serial_or_lot: "VB-050", cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  # A heat treat certificate for another furnace load of the same revision. It is a real, verified document,
  # and it says nothing about the lot that turned up.
  - { step_id: "008", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf030-008, input: { certificate_alias: proc_other_lot, cert_type: process_certificate, part_revision: valve_body_rev_a, serial_or_lot: "VB-049", cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  - { step_id: "009", set_time: "2026-07-12T08:30:00Z", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf030-009, input: { certificate_alias: coc_050, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-050", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_VERIFIED] } }
  - { step_id: "010", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf030-010, input: { certificate_alias: mtr_050, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-050", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_VERIFIED] } }
  - { step_id: "011", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf030-011, input: { certificate_alias: proc_other_lot, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-049", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_VERIFIED] } }

  - { step_id: "012", set_time: "2026-07-12T09:00:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf030-012, input: { shipment_line_alias: line_001, receiving_check_alias: check_before }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_BLOCKED] } }
  - { step_id: "013", actor: quality_1, operation: ApplyReceivingCheckResultToInventory, idempotency_key: vf030-013, input: { receiving_check_alias: check_before, inventory_item_alias: valve_body_050 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }

  # The right certificate arrives, for this lot.
  - { step_id: "014", set_time: "2026-07-12T15:00:00Z", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf030-014, input: { certificate_alias: proc_050, cert_type: process_certificate, part_revision: valve_body_rev_a, serial_or_lot: "VB-050", cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  - { step_id: "015", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf030-015, input: { certificate_alias: proc_050, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-050", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_VERIFIED] } }
  - { step_id: "016", set_time: "2026-07-12T15:10:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf030-016, input: { shipment_line_alias: line_001, receiving_check_alias: check_after }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_PASSED] } }
  - { step_id: "017", actor: quality_1, operation: ReleaseFromQuarantine, idempotency_key: vf030-017, input: { inventory_alias: valve_body_050, reason: process_certificate_received_for_this_lot }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }

assertions:
  # Only the process certificate is named. Two documents were verified and neither is blamed — a check that
  # refused everything would list all three and still satisfy a laxer assertion.
  - { assertion_id: vf030_blocked_only_on_the_process_certificate, assertion_type: record_field_equals, severity: blocking, target: { record_type: ReceivingCheck, alias: check_before }, expected: { blockers: [process_certificate_present] } }
  - { assertion_id: vf030_blocked_before, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: check_before }, expected: { state: blocked } }
  # A verified process certificate for ANOTHER lot of the same revision did not satisfy the requirement.
  - { assertion_id: vf030_other_lots_certificate_was_verified, assertion_type: record_state, severity: blocking, target: { record_type: Certificate, alias: proc_other_lot }, expected: { state: verified } }
  - { assertion_id: vf030_goods_released_once_the_right_certificate_arrived, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_050 }, expected: { state: available } }
  - { assertion_id: vf030_quarantined_while_the_certificate_was_missing, assertion_type: event_emitted, severity: blocking, target: { event_type: INVENTORY_QUARANTINED, producer_operation: ApplyReceivingCheckResultToInventory }, expected: { count: 1 } }
  - { assertion_id: vf030_passed_after_the_right_certificate, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: check_after }, expected: { state: passed } }
  - { assertion_id: vf030_release_records_why, assertion_type: record_field_equals, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_050 }, expected: { release_reason: process_certificate_received_for_this_lot } }
  - { assertion_id: vf030_history_shows_both_decisions, assertion_type: access_full, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-050" }, expected: { view: full, event_types_contain: [RECEIVING_CHECK_BLOCKED, INVENTORY_QUARANTINED, RECEIVING_CHECK_PASSED, INVENTORY_AVAILABLE] } }

idempotency_replay_checks:
  - check_id: vf030_replay_second_check
    step_id: "016"
    operation: RunReceivingCheck
    idempotency_key: vf030-016
