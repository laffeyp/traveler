scenario_id: VF-036
scenario_version: "1"
title: A run that is interrupted, blocked, failed, reworked and partly skipped still closes honestly
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  VF-001 is the clean spine: nothing goes wrong and the run closes first time. Real runs do not behave like
  that. This one is interrupted at every point the Run and RunStep machines allow, and still arrives at a close
  that says truthfully what happened.

  Eleven transitions the state machines have declared since the first slice and nothing exercised: a step made
  ready before it is started, a step blocked and cleared, a run paused for scheduling and resumed, a run
  blocked by quality and cleared back into progress, a step that fails and is reworked to completion, and a
  step that is skipped and never performed at all.

  Two distinctions this scenario exists to hold apart, because both are easy to collapse and expensive to get
  wrong. A PAUSE is a scheduling decision about when work happens; a BLOCK is a judgement that it must not
  happen yet — they carry different authority. And a step that FAILED was attempted and did not succeed, while
  a step that is BLOCKED was never attempted: only the first can reach rework.

seed: { deterministic_seed: 3036 }
clock: { start_at: "2026-08-07T08:00:00Z", timezone: "UTC", mode: controlled }

