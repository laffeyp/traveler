scenario_id: VF-042
scenario_version: "1"
title: Quarantined child refuses for production install
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove the §12.3 gate: an InventoryItem in state quarantined refuses PresentInventoryAtStation when the
  purpose is production_install. Minimal setup: register a station, walk the child to quarantined via
  ReceiveInventory then QuarantineInventory, then attempt the presentation. No Run is needed for this refusal.

seed:
  deterministic_seed: 3042

clock:
  start_at: "2026-08-28T14:00:00Z"
  timezone: "UTC"
  mode: controlled

actors:
  - { actor_id: planner_1,  actor_type: planner,          product_caller_type: planner }
  - { actor_id: quality_1,  actor_type: quality_engineer, product_caller_type: quality_engineer }
  - { actor_id: operator_1, actor_type: operator,         product_caller_type: operator }

aliases:
  child_001: InventoryItem
  station_a: Station
  presentation_001: Presentation

world:
  factory_node: hq_a
  part_revisions:
    - { alias: child_rev_a, part_number: CA-200, revision: A }
  inventory_truth:
    - { alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }

steps:
  - { step_id: "001", actor: planner_1, operation: RegisterStation, idempotency_key: vf042-001, input: { station_alias: station_a, station_type: assembly, factory_node_id: hq_a }, expect: { operation_succeeded: true, events_emitted: [STATION_REGISTERED] } }
  - { step_id: "002", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf042-002, input: { inventory_alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "003", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf042-003, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "004", actor: quality_1, operation: QuarantineInventory, idempotency_key: vf042-004, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }
  - { step_id: "030", actor: operator_1, operation: PresentInventoryAtStation, idempotency_key: vf042-030, input: { presentation_alias: presentation_001, inventory_item_alias: child_001, station_alias: station_a, actor_id: operator_1, caller_type: operator, presentation_purpose: production_install, intended_operation: InstallInventory, scan_value: "InventoryItem:child_001", scan_type: presence_asserting, presentation_source: fixture_seed, presented_at: "2026-08-28T14:12:00Z", expires_at: "2026-08-28T14:22:00Z" }, expect: { operation_succeeded: false } }

assertions:
  - { assertion_id: vf042_present_failure_class, assertion_type: operation_failed, severity: blocking, target: { step_id: "030", operation: PresentInventoryAtStation }, expected: { failure_class: inventory_quarantined } }
  - { assertion_id: vf042_child_quarantined, assertion_type: record_state, severity: blocking, target: { alias: child_001 }, expected: { state: quarantined } }
  - { assertion_id: vf042_forbid_presented, assertion_type: event_not_emitted, severity: blocking, target: { event_type: INVENTORY_PRESENTED_AT_STATION } }
