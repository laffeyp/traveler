scenario_id: VF-003F
scenario_version: "1"
registry_version: contracts-0.4.1
source: Contract Spec v0.4.1 §18 reconciliation (auto-cascade on evidence invalidation while the run is still open) + B-Q-29
note: >
  Accepted machine evidence is invalidated while its run is still open (in_progress). The §18 cascade creates a
  run-close observation (run still open) and a quality Issue (physical product may be affected). Covers the
  open-run half of the cascade that VF-003D (closed run) does not.
