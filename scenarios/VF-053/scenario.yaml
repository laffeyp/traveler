scenario_id: VF-053
scenario_version: "1"
title: Bench hidden-identity outer boundary — manufacturing_engineer cannot present
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove the §12.5 boundary: machine adapters produce MachineEvidenceRecord through ReceiveMachineEvidence,
  not Presentation. A caller of caller_type adapter attempting PresentInventoryAtStation refuses
  authorization_denied at the operation-authorization wrapper. The refusal prevents adapter output from
  leaking into physical-presence truth. This is the hidden-existence discipline's outer boundary: the
  runtime refuses the caller before the scan reaches the visibility layer.

seed:
  deterministic_seed: 3043

clock:
  start_at: "2026-08-28T14:00:00Z"
  timezone: "UTC"
  mode: controlled

actors:
  - { actor_id: planner_1,  actor_type: planner, product_caller_type: planner }
  - { actor_id: mfg_1,  actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }

aliases:
  child_001: InventoryItem
  station_a: Station
  presentation_001: Presentation

world:
  factory_node: hq_a
  part_revisions:
    - { alias: child_rev_a, part_number: CA-200, revision: A }
  inventory_truth:
    - { alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }

steps:
  - { step_id: "001", actor: planner_1, operation: RegisterStation, idempotency_key: vf053-001, input: { station_alias: station_a, station_type: assembly, factory_node_id: hq_a }, expect: { operation_succeeded: true, events_emitted: [STATION_REGISTERED] } }
  - { step_id: "002", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf053-002, input: { inventory_alias: child_001, part_revision: child_rev_a, serial_number: C-A001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "003", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf053-003, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "004", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf053-004, input: { inventory_alias: child_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "030", actor: mfg_1, operation: PresentInventoryAtStation, idempotency_key: vf053-030, input: { presentation_alias: presentation_001, inventory_item_alias: child_001, station_alias: station_a, actor_id: mfg_1, caller_type: manufacturing_engineer, presentation_purpose: production_install, intended_operation: InstallInventory, scan_value: "InventoryItem:child_001", scan_type: presence_asserting, presentation_source: fixture_seed, presented_at: "2026-08-28T14:12:00Z", expires_at: "2026-08-28T14:22:00Z" }, expect: { operation_succeeded: false } }

assertions:
  - { assertion_id: vf053_adapter_refused, assertion_type: operation_failed, severity: blocking, target: { step_id: "030", operation: PresentInventoryAtStation }, expected: { failure_class: authorization_denied } }
  - { assertion_id: vf053_forbid_presented, assertion_type: event_not_emitted, severity: blocking, target: { event_type: INVENTORY_PRESENTED_AT_STATION } }
  - { assertion_id: vf053_child_still_available, assertion_type: record_state, severity: blocking, target: { alias: child_001 }, expected: { state: available } }
