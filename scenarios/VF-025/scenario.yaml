scenario_id: VF-025
scenario_version: "1"
title: Missing certificate of conformance quarantines received inventory
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove that physical arrival is not production eligibility. A valve body arrives on a supplier shipment with
  no certificate of conformance. It is received, the receiving check blocks on the registered rule
  certificate_of_conformance_present, and applying that result quarantines the goods rather than releasing
  them. The item never reaches available, so it can never be reserved into a run. Worked in from
  receiving-evidence-registry-pack v0.1, expressed in this project's own vocabulary.

seed:
  deterministic_seed: 3025

clock:
  start_at: "2026-07-06T08:00:00Z"
  timezone: "UTC"
  mode: controlled

world:
  factory_node: node_la_001
  station: station_receiving_01
  program: program_valve_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_002, part_revision: valve_body_rev_a, serial_number: VB-002 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }

steps:
  - { step_id: "001", set_time: "2026-07-06T08:00:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf025-001, input: { inventory_alias: valve_body_002, part_revision: valve_body_rev_a, serial_number: "VB-002" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "002", set_time: "2026-07-06T08:05:00Z", actor: planner_1, operation: CreateShipment, idempotency_key: vf025-002, input: { shipment_alias: shipment_001, supplier: supplier_acme, purchase_order_ref: "PO-4471" }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_CREATED] } }
  - { step_id: "003", actor: planner_1, operation: AddShipmentLine, idempotency_key: vf025-003, input: { shipment_alias: shipment_001, shipment_line_alias: shipment_line_valve_body, inventory_item_alias: valve_body_002, part_revision: valve_body_rev_a, serial_or_lot: "VB-002", required_documents: [certificate_of_conformance] }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_LINE_CREATED] } }
  - { step_id: "004", set_time: "2026-07-06T08:10:00Z", actor: planner_1, operation: ReceiveShipment, idempotency_key: vf025-004, input: { shipment_alias: shipment_001 }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_RECEIVED] } }
  - { step_id: "005", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf025-005, input: { inventory_alias: valve_body_002 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "006", set_time: "2026-07-06T08:20:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf025-006, input: { shipment_line_alias: shipment_line_valve_body, receiving_check_alias: receiving_check_001 }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_BLOCKED] } }
  - { step_id: "007", set_time: "2026-07-06T08:25:00Z", actor: quality_1, operation: ApplyReceivingCheckResultToInventory, idempotency_key: vf025-007, input: { receiving_check_alias: receiving_check_001, inventory_item_alias: valve_body_002 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }

assertions:
  - { assertion_id: vf025_shipment_received, assertion_type: record_state, severity: blocking, target: { record_type: Shipment, alias: shipment_001 }, expected: { state: received } }
  - { assertion_id: vf025_check_blocked, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: receiving_check_001 }, expected: { state: blocked } }
  - { assertion_id: vf025_blocker_names_the_rule, assertion_type: event_payload_contains, severity: blocking, target: { event_type: RECEIVING_CHECK_BLOCKED, producer_operation: RunReceivingCheck }, expected: { blockers: [certificate_of_conformance_present] } }
  - { assertion_id: vf025_inventory_quarantined, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_002 }, expected: { state: quarantined } }
  - { assertion_id: vf025_never_available, assertion_type: event_not_emitted, severity: blocking, target: { event_type: INVENTORY_AVAILABLE }, expected: { reason: goods_without_paperwork_are_never_released } }
  - { assertion_id: vf025_check_did_not_pass, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RECEIVING_CHECK_PASSED }, expected: { reason: the_required_certificate_was_absent } }
