scenario_id: VF-004
scenario_version: "1"
title: Wrong child inventory selected blocks the build check
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  First-slice bench VF-004 (Harness §22): wrong child inventory selected. The install_required BOM
  line requires gasket_rev_b (GK-200 rev B), but the only child stocked and reserved for the build is
  gasket_rev_c (GK-200 rev C) — the wrong revision. RunBuildCheck must block AND name the blocker as a
  wrong-part blocker distinct from a missing-inventory blocker (Product Spec §212 "build checks name
  blockers"; Research Dossier: preserve distinct states, do not collapse them). Discriminates VF-004
  from VF-006 (missing) — a wrong part present is a different fact than no part at all.

seed: { deterministic_seed: 30040 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner,                product_caller_type: planner }
  - { actor_id: report_worker_1, actor_type: system_worker,    product_caller_type: system_worker }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  procedure_step_install_gasket: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  bom_line_gasket: BOMLine
  valve_body_001: InventoryItem
  gasket_wrong_001: InventoryItem
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
  effectivity_resolution_001: EffectivityResolution
  build_check_001: BuildCheckResult
  run_001: Run
  run_context_snapshot_001: RunContextSnapshot
  run_step_torque: RunStep
  run_step_install_gasket: RunStep

world:
  factory_node: node_la_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
    - { alias: gasket_rev_b, part_number: GK-200, revision: B }
    - { alias: gasket_rev_c, part_number: GK-200, revision: C }
  # The BOM requires gasket_rev_b; the operator stocked gasket_rev_c (wrong revision of the same part).
  inventory_truth:
    - { alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }
    - { alias: gasket_wrong_001, part_revision: gasket_rev_c, serial_number: GK-C-001 }
  access_policies: []

steps:
  - { step_id: "001", set_time: "2026-06-29T08:01:00Z", actor: mfg_eng_1, operation: CreateProcedureVersion, idempotency_key: vf004-001, input: { procedure_version_alias: procedure_version_v1, steps: [ { alias: procedure_step_torque, ordinal: 1, name: "Capture torque", data_collection_fields: [ { alias: data_field_torque, name: "Valve body torque", unit: Nm, lower_bound: 10.0, upper_bound: 12.0, nominal: 11.0, evaluation_mode: synchronous } ] }, { alias: procedure_step_install_gasket, ordinal: 2, name: "Install gasket", install_required: true } ] }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_CREATED] } }
  - { step_id: "002", actor: mfg_eng_1, operation: SubmitProcedureVersionForReview, idempotency_key: vf004-002, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] } }
  - { step_id: "003", actor: mfg_eng_1, operation: ReleaseProcedureVersion, idempotency_key: vf004-003, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_RELEASED] } }
  - { step_id: "004", actor: mfg_eng_1, operation: CreateManufacturingStructureVersion, idempotency_key: vf004-004, input: { manufacturing_structure_alias: manufacturing_structure_v1, part_revision: valve_body_rev_a }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_CREATED] } }
  - { step_id: "005", actor: mfg_eng_1, operation: AddBOMLine, idempotency_key: vf004-005, input: { manufacturing_structure_alias: manufacturing_structure_v1, bom_line_alias: bom_line_gasket, part_revision: gasket_rev_b, install_required: true }, expect: { operation_succeeded: true, events_emitted: [BOM_LINE_CREATED] } }
  - { step_id: "006", actor: mfg_eng_1, operation: ReleaseManufacturingStructureVersion, idempotency_key: vf004-006, input: { manufacturing_structure_alias: manufacturing_structure_v1 }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_RELEASED] } }
  - { step_id: "007", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf004-007, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "008", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf004-008, input: { inventory_alias: gasket_wrong_001, part_revision: gasket_rev_c, serial_number: GK-C-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "009", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf004-009, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "010", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf004-010, input: { inventory_alias: gasket_wrong_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "011", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf004-011, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "012", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf004-012, input: { inventory_alias: gasket_wrong_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "013", actor: planner_1, operation: ReserveInventory, idempotency_key: vf004-013, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "014", actor: planner_1, operation: ReserveInventory, idempotency_key: vf004-014, input: { inventory_alias: gasket_wrong_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "015", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf004-015, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "016", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf004-016, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "017", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf004-017, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  # Build check: the only child stocked is the wrong revision -> blocked with a wrong-part blocker.
  - { step_id: "018", set_time: "2026-06-29T08:08:00Z", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf004-018, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_FAILED, BUILD_BLOCKER_CREATED] } }
  - { step_id: "019", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf004-019, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque, run_step_install_gasket] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "020", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf004-020, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_BLOCKED] } }

assertions:
  - { assertion_id: vf004_build_check_blocked, assertion_type: record_field_equals, severity: blocking, target: { record_type: BuildCheckResult, alias: build_check_001 }, expected: { status: blocked } }
  - { assertion_id: vf004_wrong_part_blocker_named, assertion_type: event_payload_contains, severity: blocking, target: { event_type: BUILD_BLOCKER_CREATED, producer_operation: RunBuildCheck }, expected: { blocker: "wrong_part:gasket_rev_c_expected:gasket_rev_b" } }
  # Exactly one blocker fired: proves the wrong-part blocker replaced (did not co-exist with) a missing blocker.
  - { assertion_id: vf004_single_blocker, assertion_type: event_emitted, severity: blocking, target: { event_type: BUILD_BLOCKER_CREATED, producer_operation: RunBuildCheck }, expected: { count: 1 } }
  - { assertion_id: vf004_build_check_failed_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: BUILD_CHECK_FAILED, producer_operation: RunBuildCheck }, expected: { count: 1 } }
  - { assertion_id: vf004_build_check_not_passed, assertion_type: event_not_emitted, severity: blocking, target: { event_type: BUILD_CHECK_PASSED } }
  - { assertion_id: vf004_run_blocked_state, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { state: blocked } }
  - { assertion_id: vf004_run_never_ready, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_READY } }
