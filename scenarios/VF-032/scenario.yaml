scenario_id: VF-032
scenario_version: "1"
title: Goods cannot ship without a certificate of conformance, and can once it is issued
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  The outbound mirror of the receiving boundary. Inbound, goods that arrive without paperwork are not
  production eligible. Outbound, goods that leave without a certificate are not shippable. A finished valve
  body is available to ship; the first attempt is REFUSED because no certificate covers it. A certificate of
  conformance is then issued as a governed report — carrying the AS9163 minimum content and a real signature
  naming who attested and what they meant — and the same shipment then succeeds. The two attempts differ only
  in whether the certificate exists, so a gate that never refused, or one that refused always, fails this.

seed:
  deterministic_seed: 3028

clock:
  start_at: "2026-07-07T08:00:00Z"
  timezone: "UTC"
  mode: controlled

world:
  factory_node: node_la_001
  station: station_shipping_01
  program: program_valve_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_005, part_revision: valve_body_rev_a, serial_number: VB-005 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }

steps:
  - { step_id: "001", set_time: "2026-07-07T08:00:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf032-001, input: { inventory_alias: valve_body_005, part_revision: valve_body_rev_a, serial_number: "VB-005" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "002", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf032-002, input: { inventory_alias: valve_body_005 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "003", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf032-003, input: { inventory_alias: valve_body_005 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  # First attempt: nothing attests to these goods. It must be refused, and must change nothing.
  - { step_id: "004", set_time: "2026-07-07T08:10:00Z", actor: planner_1, operation: ShipInventory, idempotency_key: vf032-004, input: { inventory_alias: valve_body_005 }, expect: { operation_succeeded: false, failure_class: no_certificate_of_conformance } }
  # Issue the certificate. The signature names who attested and what the attestation means.
  - { step_id: "005", set_time: "2026-07-07T08:20:00Z", actor: quality_1, operation: GenerateCertificateOfConformance, idempotency_key: vf032-005, input: { report_alias: coc_shipment_001, certificate_number: "COC-2026-0042", supplier: "Our Factory", cage_code: "9XYZ8", customer: "Customer Aerospace", purchase_order_ref: "PO-7781", serial_aliases: [valve_body_005], conformity_statement: "The items listed conform to the purchase order, drawing revision and applicable specifications." }, expect: { operation_succeeded: true, events_emitted: [REPORT_REQUESTED, REPORT_GENERATION_STARTED, REPORT_GENERATED] } }
  # Same operation, same goods, now covered.
  - { step_id: "006", set_time: "2026-07-07T08:30:00Z", actor: planner_1, operation: ShipInventory, idempotency_key: vf032-006, input: { inventory_alias: valve_body_005 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_SHIPPED] } }
  # AS9163: a revised certificate carries a NEW distinguishable number, a revision reason and a new release
  # date, and the prior one is superseded rather than overwritten. That is this project's existing report
  # supersession — the claim is only worth making if something exercises it.
  - { step_id: "007", set_time: "2026-07-07T09:00:00Z", actor: quality_1, operation: GenerateCertificateOfConformance, idempotency_key: vf032-007, input: { report_alias: coc_shipment_001_rev_b, certificate_number: "COC-2026-0042-B", supplier: "Our Factory", cage_code: "9XYZ8", customer: "Customer Aerospace", purchase_order_ref: "PO-7781", serial_aliases: [valve_body_005], conformity_statement: "The items listed conform to the purchase order, drawing revision and applicable specifications." }, expect: { operation_succeeded: true, events_emitted: [REPORT_GENERATED] } }
  - { step_id: "008", set_time: "2026-07-07T09:01:00Z", actor: quality_1, operation: SupersedeReport, idempotency_key: vf032-008, input: { report_alias: coc_shipment_001, superseding_report_alias: coc_shipment_001_rev_b, trigger: source_record_correction }, expect: { operation_succeeded: true, events_emitted: [REPORT_SUPERSEDED] } }

assertions:
  - { assertion_id: vf032_refused_without_a_certificate, assertion_type: operation_failed, severity: blocking, target: { step_id: "004", operation: ShipInventory }, expected: { failure_class: no_certificate_of_conformance } }
  - { assertion_id: vf032_revision_is_the_live_certificate, assertion_type: report_generated, severity: blocking, target: { report_type: CertificateOfConformance, alias: coc_shipment_001_rev_b } }
  - { assertion_id: vf032_certificate_carries_its_number, assertion_type: report_field_equals, severity: blocking, target: { report_type: CertificateOfConformance, alias: coc_shipment_001, path: "sections.certificate_header.certificate_number" }, expected: { value: "COC-2026-0042" } }
  - { assertion_id: vf032_certificate_names_its_signer, assertion_type: report_field_equals, severity: blocking, target: { report_type: CertificateOfConformance, alias: coc_shipment_001, path: "sections.authorized_signature.signed_by" }, expected: { value: quality_1 } }
  - { assertion_id: vf032_certificate_names_the_customer, assertion_type: report_field_equals, severity: blocking, target: { report_type: CertificateOfConformance, alias: coc_shipment_001, path: "sections.customer.name" }, expected: { value: "Customer Aerospace" } }
  - { assertion_id: vf032_goods_shipped_after_certification, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_005 }, expected: { state: shipped } }
  - { assertion_id: vf032_prior_certificate_superseded_not_overwritten, assertion_type: record_state, severity: blocking, target: { record_type: GeneratedReport, alias: coc_shipment_001 }, expected: { state: superseded } }
  - { assertion_id: vf032_revision_carries_a_new_number, assertion_type: report_field_equals, severity: blocking, target: { report_type: CertificateOfConformance, alias: coc_shipment_001_rev_b, path: "sections.certificate_header.certificate_number" }, expected: { value: "COC-2026-0042-B" } }
  - { assertion_id: vf032_superseded_once, assertion_type: event_emitted, severity: blocking, target: { event_type: REPORT_SUPERSEDED, producer_operation: SupersedeReport }, expected: { count: 1 } }
  - { assertion_id: vf032_shipped_exactly_once, assertion_type: event_emitted, severity: blocking, target: { event_type: INVENTORY_SHIPPED, producer_operation: ShipInventory }, expected: { count: 1 } }

idempotency_replay_checks:
  - check_id: vf032_replay_certificate
    step_id: "005"
    operation: GenerateCertificateOfConformance
    idempotency_key: vf032-005
