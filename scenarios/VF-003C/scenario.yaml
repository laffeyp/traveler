scenario_id: VF-003C
scenario_version: "1"
title: Machine evidence quarantined before review
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Machine-evidence variant (Harness §20, Contract Spec §23). Torque-tool evidence is received and
  normalized, then QUARANTINED before any review (normalized -> quarantined). Proves: quarantined
  evidence reaches the quarantined terminal state; it never enters review_required; it cannot support
  production truth; the measurement is untouched.

seed: { deterministic_seed: 30033 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

