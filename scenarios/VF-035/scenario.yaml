scenario_id: VF-035
scenario_version: "1"
title: Supplier material carries its receiving evidence into the run close report
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  boundary_spec: Receiving Evidence Boundary Specification v0.1 (§23.3, acceptance criterion 12)
  registry_version: contracts-0.4.1

purpose: >
  Acceptance criterion 12: the run close report summarizes receiving evidence for installed supplier material.

  VF-001 is the clean production spine, and its gasket appears by fiat — created, received, released. Here the
  same gasket arrives from a supplier with a certificate of conformance and a mill test report, both verified
  by a quality engineer before the receiving check will pass. The valve body it goes into is made in-house and
  releases the ordinary way, so one report covers both origins.

  The point of the report section is that a reader can tell those two apart. The gasket reads
  `supplier_received` with its supplier, its check result and its two verified documents; the valve body reads
  `not_supplier_received`. Saying the second out loud matters as much as the first: if internally made parts
  were simply omitted, "we make this ourselves" and "we lost the paperwork" would look identical, and a blank
  is the one answer a traceability report must never give.

seed: { deterministic_seed: 3035 }
clock: { start_at: "2026-07-13T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }
  - { actor_id: operator_1, actor_type: operator, product_caller_type: operator }
  - { actor_id: report_worker_1, actor_type: system_worker, product_caller_type: system_worker }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  procedure_step_install_gasket: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  bom_line_gasket: BOMLine
  valve_body_020: InventoryItem
  gasket_020: InventoryItem
  shipment_001: Shipment
  shipment_line_gasket: ShipmentLine
  coc_gasket: Certificate
  mtr_gasket: Certificate
  receiving_check_001: ReceivingCheck
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
