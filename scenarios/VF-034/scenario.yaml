scenario_id: VF-034
scenario_version: "1"
title: Quarantined goods leave quarantine only when the missing paperwork arrives
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  The exit from VF-025. A consignment arrives without its certificate and is quarantined. The supplier then
  sends the certificate. Release is attempted BEFORE the receiving check is re-run and is REFUSED — the goods
  may only leave quarantine through their own gate, not by an operator deciding they are fine. The check is
  then re-run, passes, and the same release succeeds. Without this the boundary was a trap: goods could enter
  quarantine and nothing could ever let them out.

seed:
  deterministic_seed: 3030

clock:
  start_at: "2026-07-08T08:00:00Z"
  timezone: "UTC"
  mode: controlled

world:
  factory_node: node_la_001
  station: station_receiving_01
  program: program_valve_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_007, part_revision: valve_body_rev_a, serial_number: VB-007 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }

steps:
  - { step_id: "001", set_time: "2026-07-08T08:00:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf030-001, input: { inventory_alias: valve_body_007, part_revision: valve_body_rev_a, serial_number: "VB-007" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "002", actor: planner_1, operation: CreateShipment, idempotency_key: vf030-002, input: { shipment_alias: shipment_001, supplier: supplier_acme, purchase_order_ref: "PO-9013" }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_CREATED] } }
  - { step_id: "003", actor: planner_1, operation: AddShipmentLine, idempotency_key: vf030-003, input: { shipment_alias: shipment_001, shipment_line_alias: shipment_line_valve_body, inventory_item_alias: valve_body_007, part_revision: valve_body_rev_a, serial_or_lot: "VB-007", required_documents: [certificate_of_conformance] }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_LINE_CREATED] } }
  - { step_id: "004", actor: planner_1, operation: ReceiveShipment, idempotency_key: vf030-004, input: { shipment_alias: shipment_001 }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_RECEIVED] } }
  - { step_id: "005", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf030-005, input: { inventory_alias: valve_body_007 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "006", set_time: "2026-07-08T08:15:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf030-006, input: { shipment_line_alias: shipment_line_valve_body, receiving_check_alias: receiving_check_001 }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_BLOCKED] } }
  - { step_id: "007", actor: quality_1, operation: ApplyReceivingCheckResultToInventory, idempotency_key: vf030-007, input: { receiving_check_alias: receiving_check_001, inventory_item_alias: valve_body_007 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }
  # The supplier sends the certificate.
  - { step_id: "008", set_time: "2026-07-08T09:00:00Z", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf030-008, input: { certificate_alias: coc_vb007, cert_type: certificate_of_conformance, part_revision: valve_body_rev_a, serial_or_lot: "VB-007", cage_code: "1ABC2", expires_at: "2027-06-01T00:00:00Z" }, expect: { operation_succeeded: true } }
  # Release attempted on the strength of the paperwork alone, without re-running the gate. Refused.
  - { step_id: "009", set_time: "2026-07-08T09:05:00Z", actor: planner_1, operation: ReleaseFromQuarantine, idempotency_key: vf030-009, input: { inventory_alias: valve_body_007, reason: certificate_received }, expect: { operation_succeeded: false, failure_class: receiving_check_not_passed } }
  # Re-run the gate. Now it passes.
  - { step_id: "010", set_time: "2026-07-08T09:10:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf030-010, input: { shipment_line_alias: shipment_line_valve_body, receiving_check_alias: receiving_check_002 }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_PASSED] } }
  - { step_id: "011", set_time: "2026-07-08T09:15:00Z", actor: quality_1, operation: ReleaseFromQuarantine, idempotency_key: vf030-011, input: { inventory_alias: valve_body_007, reason: certificate_received_and_verified }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }

assertions:
  - { assertion_id: vf030_quarantined_first, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: receiving_check_001 }, expected: { state: blocked } }
  - { assertion_id: vf030_release_refused_before_the_gate_passed, assertion_type: operation_failed, severity: blocking, target: { step_id: "009", operation: ReleaseFromQuarantine }, expected: { failure_class: receiving_check_not_passed } }
  - { assertion_id: vf030_second_check_passed, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: receiving_check_002 }, expected: { state: passed } }
  - { assertion_id: vf030_goods_released, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_007 }, expected: { state: available } }
  - { assertion_id: vf030_release_records_who_and_why, assertion_type: record_field_equals, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_007 }, expected: { released_from_quarantine_by: quality_1, release_reason: certificate_received_and_verified } }
  - { assertion_id: vf030_serial_history_shows_both_decisions, assertion_type: access_full, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-007" }, expected: { view: full, event_types_contain: [RECEIVING_CHECK_BLOCKED, INVENTORY_QUARANTINED, RECEIVING_CHECK_PASSED, INVENTORY_AVAILABLE] } }

idempotency_replay_checks:
  - check_id: vf030_replay_second_check
    step_id: "010"
    operation: RunReceivingCheck
    idempotency_key: vf030-010
