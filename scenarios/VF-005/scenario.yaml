scenario_id: VF-005
scenario_version: "1"
title: Quarantined child inventory blocks the build check
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  First-slice bench VF-005 (Harness §22): quarantined child inventory selected. The install_required
  BOM line requires gasket_rev_b, and a gasket_rev_b unit exists — but it is quarantined (received ->
  quarantined via QuarantineInventory) and therefore not a valid build candidate. Two independent
  proofs: (1) a quarantined item cannot be reserved (available -> reserved is the only reserve
  transition; the state machine fails-closed on quarantined -> reserved); (2) RunBuildCheck blocks and
  names a quarantined-inventory blocker distinct from missing (VF-006) and wrong-part (VF-004). The
  part exists and is the right revision — the fact that it is on quality hold is a different fact than
  absence, and the build check must preserve that distinction (Research Dossier; Product Spec §212).

seed: { deterministic_seed: 30050 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner,                product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer,       product_caller_type: quality_engineer }
  - { actor_id: report_worker_1, actor_type: system_worker,    product_caller_type: system_worker }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  procedure_step_install_gasket: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  bom_line_gasket: BOMLine
  valve_body_001: InventoryItem
  gasket_001: InventoryItem
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
  effectivity_resolution_001: EffectivityResolution
  build_check_001: BuildCheckResult
  run_001: Run
  run_context_snapshot_001: RunContextSnapshot
  run_step_torque: RunStep
  run_step_install_gasket: RunStep

world:
  factory_node: node_la_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
    - { alias: gasket_rev_b, part_number: GK-200, revision: B }
  # The gasket exists and is the right revision, but is placed on quality hold (quarantined).
  inventory_truth:
    - { alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }
    - { alias: gasket_001, part_revision: gasket_rev_b, serial_number: GK-001 }
  access_policies: []

steps:
  - { step_id: "001", set_time: "2026-06-29T08:01:00Z", actor: mfg_eng_1, operation: CreateProcedureVersion, idempotency_key: vf005-001, input: { procedure_version_alias: procedure_version_v1, steps: [ { alias: procedure_step_torque, ordinal: 1, name: "Capture torque", data_collection_fields: [ { alias: data_field_torque, name: "Valve body torque", unit: Nm, lower_bound: 10.0, upper_bound: 12.0, nominal: 11.0, evaluation_mode: synchronous } ] }, { alias: procedure_step_install_gasket, ordinal: 2, name: "Install gasket", install_required: true } ] }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_CREATED] } }
  - { step_id: "002", actor: mfg_eng_1, operation: SubmitProcedureVersionForReview, idempotency_key: vf005-002, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] } }
  - { step_id: "003", actor: mfg_eng_1, operation: ReleaseProcedureVersion, idempotency_key: vf005-003, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_RELEASED] } }
  - { step_id: "004", actor: mfg_eng_1, operation: CreateManufacturingStructureVersion, idempotency_key: vf005-004, input: { manufacturing_structure_alias: manufacturing_structure_v1, part_revision: valve_body_rev_a }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_CREATED] } }
  - { step_id: "005", actor: mfg_eng_1, operation: AddBOMLine, idempotency_key: vf005-005, input: { manufacturing_structure_alias: manufacturing_structure_v1, bom_line_alias: bom_line_gasket, part_revision: gasket_rev_b, install_required: true }, expect: { operation_succeeded: true, events_emitted: [BOM_LINE_CREATED] } }
  - { step_id: "006", actor: mfg_eng_1, operation: ReleaseManufacturingStructureVersion, idempotency_key: vf005-006, input: { manufacturing_structure_alias: manufacturing_structure_v1 }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_RELEASED] } }
  - { step_id: "007", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf005-007, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "008", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf005-008, input: { inventory_alias: gasket_001, part_revision: gasket_rev_b, serial_number: GK-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "009", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf005-009, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "010", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf005-010, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "011", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf005-011, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  # Quarantine the gasket (received -> quarantined). QuarantineInventory is registered but was
  # unexercised before VF-005 (the VF-003A dynamic).
  - { step_id: "012", set_time: "2026-06-29T08:06:00Z", actor: quality_1, operation: QuarantineInventory, idempotency_key: vf005-012, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }
  # NEGATIVE: a quarantined item cannot be reserved. Fails-closed (quarantined -> reserved unregistered).
  - { step_id: "013", actor: planner_1, operation: ReserveInventory, idempotency_key: vf005-013, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: false } }
  - { step_id: "014", actor: planner_1, operation: ReserveInventory, idempotency_key: vf005-014, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "015", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf005-015, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "016", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf005-016, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "017", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf005-017, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  # Build check: the only gasket_rev_b unit is quarantined -> blocked with a quarantined-inventory blocker.
  - { step_id: "018", set_time: "2026-06-29T08:08:00Z", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf005-018, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_FAILED, BUILD_BLOCKER_CREATED] } }
  - { step_id: "019", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf005-019, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque, run_step_install_gasket] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "020", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf005-020, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_BLOCKED] } }

assertions:
  - { assertion_id: vf005_reserve_quarantined_refused, assertion_type: operation_failed, severity: blocking, target: { step_id: "013", operation: ReserveInventory }, expected: { failure_class: state_transition_forbidden } }
  - { assertion_id: vf005_gasket_still_quarantined, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: gasket_001 }, expected: { state: quarantined } }
  - { assertion_id: vf005_build_check_blocked, assertion_type: record_field_equals, severity: blocking, target: { record_type: BuildCheckResult, alias: build_check_001 }, expected: { status: blocked } }
  - { assertion_id: vf005_quarantined_blocker_named, assertion_type: event_payload_contains, severity: blocking, target: { event_type: BUILD_BLOCKER_CREATED, producer_operation: RunBuildCheck }, expected: { blocker: "quarantined_inventory:gasket_rev_b" } }
  - { assertion_id: vf005_single_blocker, assertion_type: event_emitted, severity: blocking, target: { event_type: BUILD_BLOCKER_CREATED, producer_operation: RunBuildCheck }, expected: { count: 1 } }
  - { assertion_id: vf005_build_check_failed_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: BUILD_CHECK_FAILED, producer_operation: RunBuildCheck }, expected: { count: 1 } }
  - { assertion_id: vf005_build_check_not_passed, assertion_type: event_not_emitted, severity: blocking, target: { event_type: BUILD_CHECK_PASSED } }
  - { assertion_id: vf005_run_blocked_state, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { state: blocked } }
  - { assertion_id: vf005_run_never_ready, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_READY } }
