scenario_id: VF-003
scenario_version: "1.1"
registry_version: contracts-0.4.1
source: Executable VF-003 Scenario Spec v0.1.1 (sections 1.2, 8, 10, 11, 12, 15) + Harness Spec v0.1.2 section 25
note: >
  Reference manifest for the registry-extraction gate. Lists every contract name VF-003 depends on.
  The full scenario package (scenario.yaml, inputs, assertions) is materialized in a later sprint
  (doc 08 Phase 3); this manifest exists so sprint 001's validator can prove VF-003 references resolve.

