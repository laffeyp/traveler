# Record states VF-003 asserts (section 11). Each must be a valid state of that record's state machine.
record_states:
  ProcedureVersion: [released]
  ManufacturingStructureVersion: [released]
  InventoryItem: [expected, received, available, reserved, in_wip, installed]
  Run: [planned, ready, in_progress, complete, close_check, close_blocked, closed]
  RunStep: [not_started, in_progress, complete]
  Nonconformance: [open, disposition_pending, dispositioned, in_rework, verification_pending, verified, closed]
  MachineEvidenceRecord: [review_required]
  Redline: [applied]
  ApprovalRequest: [approved]
  GeneratedReport: [generated]

projections: [AsBuiltProjection, SerialHistory, RunCloseReadiness, ReportSourceIndex]

reports: [RunCloseReport]

assertion_types:
  - record_exists
  - record_state
  - record_field_equals
  - event_emitted
  - event_not_emitted
  - report_generated
  - projection_contains
  - access_summary
  - bounded_drill_down_filtered
  - idempotent_replay
  - operation_succeeded

