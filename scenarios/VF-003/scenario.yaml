  - { assertion_id: vf003_run_context_snapshot_exists, assertion_type: record_exists, severity: blocking, target: { record_type: RunContextSnapshot, alias: run_context_snapshot_001 } }
  - { assertion_id: vf003_failed_measurement, assertion_type: record_field_equals, severity: blocking, target: { record_type: Measurement, alias: measurement_torque_failed }, expected: { result: fail } }
  - { assertion_id: vf003_passing_measurement, assertion_type: record_field_equals, severity: blocking, target: { record_type: Measurement, alias: measurement_torque_passed }, expected: { result: pass } }
  - { assertion_id: vf003_failed_measurement_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: MEASUREMENT_FAILED, producer_operation: CaptureMeasurement }, expected: { count: 1 } }
  - { assertion_id: vf003_nonconformance_closed, assertion_type: record_state, severity: blocking, target: { record_type: Nonconformance, alias: nonconformance_001 }, expected: { status: closed } }
  - { assertion_id: vf003_containment_exists, assertion_type: record_exists, severity: blocking, target: { record_type: QualityContainmentAction, alias: containment_action_001 } }
  - { assertion_id: vf003_redline_applied, assertion_type: record_state, severity: blocking, target: { record_type: Redline, alias: redline_001 }, expected: { status: applied } }
  - { assertion_id: vf003_approval_approved, assertion_type: record_state, severity: blocking, target: { record_type: ApprovalRequest, alias: approval_request_001 }, expected: { status: approved } }
  # machine_evidence_reviewed_if_required (Contract Spec §16): the run closes with this evidence still in
  # review, which VF-003's own acceptance requires — so the rule is satisfied by REPRESENTING the outstanding
  # evidence on the close, not by blocking. Without this the close was silent about an evidence gap.
  - { assertion_id: vf003_outstanding_evidence_is_represented_on_the_close, assertion_type: event_payload_contains, severity: blocking, target: { event_type: RUN_CLOSE_OBSERVATION_CREATED, producer_operation: RunCloseCheck }, expected: { observation_rule: machine_evidence_reviewed_if_required } }
  - { assertion_id: vf003_machine_evidence_review_required, assertion_type: record_state, severity: blocking, target: { record_type: MachineEvidenceRecord, alias: torque_evidence_001 }, expected: { state: review_required } }
  - { assertion_id: vf003_evidence_did_not_overwrite_measurement, assertion_type: event_emitted, severity: blocking, target: { event_type: MEASUREMENT_PASSED }, expected: { count: 1 } }
  - { assertion_id: vf003_evidence_not_accepted, assertion_type: event_not_emitted, severity: blocking, target: { event_type: MACHINE_EVIDENCE_ACCEPTED } }
  - { assertion_id: vf003_late_evidence_does_not_close_run, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_CLOSED, after_step: "040", before_step: "051" } }
  - { assertion_id: vf003_late_evidence_keeps_close_blocked, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001, checkpoint: after_step_047 }, expected: { status: close_blocked } }
  - { assertion_id: vf003_single_verification_pending, assertion_type: event_emitted, severity: blocking, target: { event_type: VERIFICATION_PENDING, producer_operation: CompleteRework }, expected: { count: 1 } }
  - { assertion_id: vf003_first_close_blocked, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_CLOSE_CHECK_BLOCKED, producer_operation: RunCloseCheck }, expected: { count: 1 } }
  - { assertion_id: vf003_run_close_state_blocked, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_CLOSE_STATE_BLOCKED, producer_operation: ApplyRunCloseResultToRun }, expected: { count: 1 } }
  - { assertion_id: vf003_report_generated, assertion_type: report_generated, severity: blocking, target: { report_type: RunCloseReport, alias: run_close_report_001 } }
  - { assertion_id: vf003_report_has_required_sections, assertion_type: report_payload_contains, severity: blocking, target: { report_type: RunCloseReport, alias: run_close_report_001 }, expected: { sections: [report_header, run_context, executed_steps, measurement_summary, quality_path, redline_history, installed_inventory, machine_evidence_summary, run_close_observations, final_close_result, source_traceability, access_policy_snapshot] } }
  - { assertion_id: vf003_run_closed, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { status: closed } }
  - { assertion_id: vf003_asbuilt_contains_gasket, assertion_type: projection_contains, severity: blocking, target: { projection: AsBuiltProjection, key_alias: valve_body_001 }, expected: { child_alias: gasket_001 } }
  - { assertion_id: vf003_serial_history_chain, assertion_type: projection_contains, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001" }, expected: { event_types: [MEASUREMENT_FAILED, NONCONFORMANCE_OPENED, REDLINE_APPLIED, MEASUREMENT_PASSED, INVENTORY_INSTALLED, MACHINE_EVIDENCE_REVIEW_REQUIRED, VERIFICATION_COMPLETED, REPORT_GENERATED, RUN_CLOSED] } }
  - { assertion_id: vf003_bounded_drill_down_filtered, assertion_type: bounded_drill_down_filtered, severity: blocking, target: { operation: BoundedDrillDown, actor: customer_viewer_1 }, expected: { hidden: [raw_machine_payload, controlled_machine_evidence_payload, internal_quality_notes] } }
  # SDD assert_signal with partial payload (Foundation 02): the event carries the right foreign keys.
  - { assertion_id: vf003_failed_measurement_payload, assertion_type: event_payload_contains, severity: blocking, target: { event_type: MEASUREMENT_FAILED, producer_operation: CaptureMeasurement }, expected: { measurement_id: measurement_torque_failed } }
  - { assertion_id: vf003_install_payload, assertion_type: event_payload_contains, severity: blocking, target: { event_type: INVENTORY_INSTALLED, producer_operation: InstallInventory }, expected: { child_inventory_alias: gasket_001, parent_inventory_alias: valve_body_001 } }
  # SDD technique #42 signal-coverage: the confirmed-good event sequence (VF-003 spec §10) as a
  # regression fixture — the observed trace must contain this ordered spine as a subsequence.
  # once-per-run milestone events only (the matcher is filtered-exact: each listed type must appear
  # exactly once, in this order). Recurring events (RUN_STEP_STARTED, INVENTORY_IN_WIP,
  # RUN_ENTERED_CLOSE_CHECK) are intentionally excluded — the block/pass checks pin the two close cycles.
  - { assertion_id: vf003_event_sequence_spine, assertion_type: event_sequence_matches, severity: blocking, target: {}, expected: { sequence: [PROCEDURE_VERSION_RELEASED, MANUFACTURING_STRUCTURE_RELEASED, EFFECTIVITY_RESOLVED, BUILD_CHECK_PASSED, RUN_CREATED, RUN_READY, RUN_STARTED, MEASUREMENT_FAILED, NONCONFORMANCE_OPENED, QUALITY_CONTAINMENT_STARTED, REDLINE_APPROVED, REDLINE_APPLIED, MEASUREMENT_PASSED, INVENTORY_INSTALLED, MACHINE_EVIDENCE_REVIEW_REQUIRED, RUN_COMPLETED, RUN_CLOSE_CHECK_BLOCKED, RUN_CLOSE_STATE_BLOCKED, DISPOSITION_RECORDED, REWORK_COMPLETED, VERIFICATION_COMPLETED, NONCONFORMANCE_CLOSED, RUN_CLOSE_CHECK_PASSED, REPORT_GENERATED, RUN_CLOSED] } }

# SDD idempotency observation contract (VF-003 §18; doc 08 Phase 9): re-executing these steps with
# the same idempotency_key must create zero duplicate facts.
idempotency_replay_checks:
  - { check_id: vf003_replay_capture_failed, step_id: "024", operation: CaptureMeasurement, idempotency_key: vf003-024-capture-failed-torque }
  - { check_id: vf003_replay_install, step_id: "038", operation: InstallInventory, idempotency_key: vf003-038-install-gasket }
  - { check_id: vf003_replay_generate_report, step_id: "056", operation: GenerateRunCloseReport, idempotency_key: vf003-056-generate-run-close-report }
