scenario_id: VF-003
scenario_version: "1.1"
title: Valve body failed torque redline rework
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove failed measurement, quality containment, redline approval, serialized install,
  machine evidence review, run close blocking, report generation, serial history, and
  access filtering. The product must not close the run until the failed measurement has a
  complete quality path and a governed close report exists.

seed:
  deterministic_seed: 3003

clock:
  start_at: "2026-06-29T08:00:00Z"
  timezone: "UTC"
  mode: controlled

# actor_id -> product_caller_type (must be a registered caller type in modules.yaml)
actors:
