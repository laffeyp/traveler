  - { actor_id: quality_1,        actor_type: quality_engineer,              product_caller_type: quality_engineer }
  - { actor_id: quality_2,        actor_type: quality_engineer,              product_caller_type: quality_engineer }  # distinct verifier: cannot verify one's own rework (segregation of duties)
