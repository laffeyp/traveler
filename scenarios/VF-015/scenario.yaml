scenario_id: VF-015
scenario_version: "1"
title: Unsupported machine payload creates a GrammarGap instead of false certainty
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Extended adversarial VF-015 (Harness §21/§24): an unsupported machine payload creates a GrammarGap. The
  executor rule as a PRODUCT FEATURE — when an external payload cannot be normalized into known grammar,
  the system escalates a typed GrammarGap rather than fabricating certainty (Harness §21; Product Spec
  grammar-gap escalation; Research Dossier: no false certainty). Today NormalizeMachineEvidence blindly
  emits MACHINE_EVIDENCE_NORMALIZED with undefined fields for ANY payload (B-Q-16). VF-015 makes it
  auto-escalate: an unsupported payload_type -> GRAMMAR_GAP_CREATED, record NOT normalized, no MEASUREMENT.
  The POSITIVE CONTROL (a well-formed torque_trace) still normalizes cleanly — proving the trigger
  DISCRIMINATES the un-normalizable from the normal, not a blanket refusal. Trigger predicate: B-Q-26.

seed: { deterministic_seed: 30150 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: machine_adapter_1, actor_type: adapter, product_caller_type: adapter }
  - { actor_id: report_worker_1, actor_type: system_worker, product_caller_type: system_worker }

aliases:
  bad_evidence_001: MachineEvidenceRecord
  good_evidence_001: MachineEvidenceRecord

world:
  factory_node: node_la_001
  machines:
    - { alias: torque_tool_001, machine_type: torque_tool, adapter: machine_adapter_1 }
    - { alias: vibration_probe_001, machine_type: vibration_probe, adapter: machine_adapter_1 }
  access_policies: []

steps:
  # UNSUPPORTED payload: a payload_type the normalizer has no grammar for.
  - { step_id: "001", set_time: "2026-06-29T08:40:00Z", actor: machine_adapter_1, operation: ReceiveMachineEvidence, idempotency_key: vf015-recv-bad, input: { alias: bad_evidence_001, machine_alias: vibration_probe_001, adapter_alias: machine_adapter_1, payload_type: vibration_spectrum, occurred_at: "2026-06-29T08:34:30Z", received_at: "2026-06-29T08:40:00Z", payload: { serial_number: "VB-001", spectrum_blob: "AZ4f...opaque...", sample_rate_hz: 48000 } }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_RECEIVED] } }
  # Normalize the unsupported payload -> auto-escalate a GrammarGap; do NOT fabricate a normalized result.
  - { step_id: "002", actor: report_worker_1, operation: NormalizeMachineEvidence, idempotency_key: vf015-norm-bad, input: { evidence_alias: bad_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [GRAMMAR_GAP_CREATED] } }
  # POSITIVE CONTROL: a well-formed torque_trace still normalizes cleanly (the trigger discriminates).
  - { step_id: "003", set_time: "2026-06-29T08:41:00Z", actor: machine_adapter_1, operation: ReceiveMachineEvidence, idempotency_key: vf015-recv-good, input: { alias: good_evidence_001, machine_alias: torque_tool_001, adapter_alias: machine_adapter_1, payload_type: torque_trace, occurred_at: "2026-06-29T08:35:30Z", received_at: "2026-06-29T08:41:00Z", payload: { serial_number: "VB-002", tool_id: "TT-001", measured_torque_nm: 11.1, trace_quality: acceptable } }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_RECEIVED] } }
  - { step_id: "004", actor: report_worker_1, operation: NormalizeMachineEvidence, idempotency_key: vf015-norm-good, input: { evidence_alias: good_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_NORMALIZED] } }

assertions:
  # THE escalation: a GrammarGap is created (record + event), naming the reason.
  - { assertion_id: vf015_grammar_gap_created, assertion_type: grammar_gap_created, severity: blocking, target: { record_type: GrammarGap }, expected: { count: 1, reason: unsupported_payload_type } }
  # The unsupported payload was NOT normalized (no false certainty): the bad record stays raw.
  - { assertion_id: vf015_bad_not_normalized, assertion_type: record_state, severity: blocking, target: { record_type: MachineEvidenceRecord, alias: bad_evidence_001 }, expected: { state: raw } }
  # Exactly ONE normalize happened (the good one) and exactly ONE gap (the bad one) — the trigger discriminates.
  - { assertion_id: vf015_normalized_once, assertion_type: event_emitted, severity: blocking, target: { event_type: MACHINE_EVIDENCE_NORMALIZED, producer_operation: NormalizeMachineEvidence }, expected: { count: 1 } }
  - { assertion_id: vf015_gap_once, assertion_type: event_emitted, severity: blocking, target: { event_type: GRAMMAR_GAP_CREATED }, expected: { count: 1 } }
  # The positive control normalized cleanly (proves not a blanket refusal).
  - { assertion_id: vf015_good_normalized, assertion_type: record_state, severity: blocking, target: { record_type: MachineEvidenceRecord, alias: good_evidence_001 }, expected: { state: normalized } }
  # No production truth was derived from the unsupported payload.
  - { assertion_id: vf015_no_measurement, assertion_type: event_not_emitted, severity: blocking, target: { event_type: MEASUREMENT_CAPTURED } }
