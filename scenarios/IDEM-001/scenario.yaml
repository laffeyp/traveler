scenario_id: IDEM-001
scenario_version: "1"
title: Write-boundary idempotency — a duplicate transactional write conflicts
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Hardening regression (B-Q-13): write-boundary idempotency for a transactional_unique_constraint operation.
  CreateInventoryItem is retried with the SAME idempotency_key (an at-least-once re-delivery). Per Contract
  Spec §6 / Build Readiness §4.5, the second write must NOT create a duplicate record — it returns
  idempotency_conflict with zero facts. This is DISTINCT from the required_idempotency_key in-instance memo
  (VF-011, which returns the prior result): here the persisted unique constraint rejects the duplicate write,
  and it survives a cold reload (the backend node proof). This scenario locks the behavior in the bench on
  BOTH drivers — the harness idempotency_conflict path is otherwise unexercised at the scenario level.

seed: { deterministic_seed: 40010 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }

aliases:
  valve_body_001: InventoryItem
  valve_body_dup: InventoryItem

world:
  factory_node: node_la_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }
  access_policies: []

steps:
  # First write commits under the key.
  - { step_id: "001", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: idem-dup-key, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  # Retry with the SAME idempotency_key (a re-delivery) -> the write-boundary unique constraint conflicts,
  # zero new facts. A different alias makes clear it is the KEY that dedups, not the record identity.
  - { step_id: "002", set_time: "2026-06-29T08:05:02Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: idem-dup-key, input: { inventory_alias: valve_body_dup, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: false } }

assertions:
  # The duplicate write conflicted — pinned to the idempotency_conflict class (not any failure).
  - { assertion_id: idem001_dup_conflict, assertion_type: operation_failed, severity: blocking, target: { step_id: "002", operation: CreateInventoryItem }, expected: { failure_class: idempotency_conflict } }
  # Exactly ONE record was created; the duplicate wrote nothing.
  - { assertion_id: idem001_created_once, assertion_type: event_emitted, severity: blocking, target: { event_type: INVENTORY_CREATED, producer_operation: CreateInventoryItem }, expected: { count: 1 } }
  - { assertion_id: idem001_no_second_create, assertion_type: event_not_emitted, severity: blocking, target: { event_type: INVENTORY_CREATED, after_step: "001" } }
  # The first record exists; the duplicate alias never resolved to a record.
  - { assertion_id: idem001_first_exists, assertion_type: record_exists, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_001 }, expected: {} }
