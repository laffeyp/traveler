  nonconformance_001: Nonconformance
  affected_population_001: AffectedPopulation
  containment_action_001: QualityContainmentAction
  installation_event_001: InstallationEvent
  run_close_check_001: RunCloseCheck

world:
  access_policies: []

steps:
