  - { step_id: "010", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf002-010, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "011", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf002-011, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "012", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf002-012, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "013", actor: planner_1, operation: ReserveInventory, idempotency_key: vf002-013, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "014", actor: planner_1, operation: ReserveInventory, idempotency_key: vf002-014, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "015", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf002-015, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "016", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf002-016, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "017", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf002-017, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  - { step_id: "018", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf002-018, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_PASSED] } }
  - { step_id: "019", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf002-019, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque, run_step_install_gasket] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "020", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf002-020, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_READY] } }
  - { step_id: "021", set_time: "2026-06-29T08:12:00Z", actor: operator_1, operation: StartRun, idempotency_key: vf002-021, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_STARTED] } }
  - { step_id: "022", actor: operator_1, operation: StartRunWithInventory, idempotency_key: vf002-022, input: { run_alias: run_001, inventory_aliases: [valve_body_001, gasket_001] }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_IN_WIP] } }
  - { step_id: "023", actor: operator_1, operation: StartRunStep, idempotency_key: vf002-023, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_STARTED] } }
  - { step_id: "024", set_time: "2026-06-29T08:17:00Z", actor: operator_1, operation: CaptureMeasurement, idempotency_key: vf002-024, input: { run_alias: run_001, run_step_alias: run_step_torque, data_collection_field_alias: data_field_torque, measurement_alias: measurement_torque_failed, value: 8.2, unit: Nm, source_type: operator_entry, captured_at: "2026-06-29T08:17:00Z" }, expect: { operation_succeeded: true, events_emitted: [MEASUREMENT_CAPTURED, MEASUREMENT_EVALUATED, MEASUREMENT_FAILED] } }
  - { step_id: "025", set_time: "2026-06-29T08:18:00Z", actor: quality_1, operation: OpenNonconformance, idempotency_key: vf002-025, input: { nonconformance_alias: nonconformance_001, source_measurement_alias: measurement_torque_failed, run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [NONCONFORMANCE_OPENED] } }
  - { step_id: "026", actor: quality_1, operation: DefineAffectedPopulation, idempotency_key: vf002-026, input: { nonconformance_alias: nonconformance_001, affected_population_alias: affected_population_001, scope_type: specific_serials, serials: [VB-001] }, expect: { operation_succeeded: true, events_emitted: [NONCONFORMANCE_DISPOSITION_PENDING] } }
  - { step_id: "027", actor: quality_1, operation: StartQualityContainment, idempotency_key: vf002-027, input: { nonconformance_alias: nonconformance_001, containment_action_alias: containment_action_001 }, expect: { operation_succeeded: true, events_emitted: [QUALITY_CONTAINMENT_REQUIRED] } }
  - { step_id: "028", actor: quality_1, operation: ActivateQualityContainment, idempotency_key: vf002-028, input: { nonconformance_alias: nonconformance_001, containment_action_alias: containment_action_001 }, expect: { operation_succeeded: true, events_emitted: [QUALITY_CONTAINMENT_STARTED] } }
  # Operator proceeds and attempts to close the run WITHOUT remediating the failure (no redline/rework).
  # The run-close check must catch the unremediated failed measurement and BLOCK (Contract Spec §16
  # failed_measurement_has_quality_path). This is the safety property VF-002 exists to prove.
  - { step_id: "029", actor: operator_1, operation: CompleteRunStep, idempotency_key: vf002-029, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_COMPLETED] } }
  - { step_id: "030", actor: operator_1, operation: StartRunStep, idempotency_key: vf002-030, input: { run_alias: run_001, run_step_alias: run_step_install_gasket }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_STARTED] } }
  - { step_id: "031", set_time: "2026-06-29T08:35:00Z", actor: operator_1, operation: InstallInventory, idempotency_key: vf002-031, input: { run_alias: run_001, run_step_alias: run_step_install_gasket, parent_inventory_alias: valve_body_001, child_inventory_alias: gasket_001, bom_line_alias: bom_line_gasket, installation_event_alias: installation_event_001, installed_at: "2026-06-29T08:35:00Z" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_INSTALLED] } }
  - { step_id: "032", actor: operator_1, operation: CompleteRunStep, idempotency_key: vf002-032, input: { run_alias: run_001, run_step_alias: run_step_install_gasket }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_COMPLETED] } }
  - { step_id: "033", actor: operator_1, operation: CompleteRunSteps, idempotency_key: vf002-033, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_COMPLETED] } }
  - { step_id: "034", set_time: "2026-06-29T08:45:00Z", actor: operator_1, operation: AttemptRunClose, idempotency_key: vf002-034, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_ENTERED_CLOSE_CHECK] } }
  - { step_id: "035", set_time: "2026-06-29T08:46:00Z", actor: report_worker_1, operation: RunCloseCheck, idempotency_key: vf002-035, input: { run_alias: run_001, run_close_check_alias: run_close_check_001, expected_result: blocked, expected_blockers: [failed_measurement_has_quality_path] }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_CHECK_STARTED, RUN_CLOSE_OBSERVATION_CREATED, RUN_CLOSE_CHECK_BLOCKED] } }
  - { step_id: "036", actor: report_worker_1, operation: ApplyRunCloseResultToRun, idempotency_key: vf002-036, input: { run_alias: run_001, run_close_check_alias: run_close_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_STATE_BLOCKED] } }

assertions:
  - { assertion_id: vf002_procedure_released, assertion_type: record_state, severity: blocking, target: { record_type: ProcedureVersion, alias: procedure_version_v1 }, expected: { status: released } }
  - { assertion_id: vf002_build_check_passed, assertion_type: record_field_equals, severity: blocking, target: { record_type: BuildCheckResult, alias: build_check_001 }, expected: { status: passed } }
  - { assertion_id: vf002_measurement_failed, assertion_type: record_field_equals, severity: blocking, target: { record_type: Measurement, alias: measurement_torque_failed }, expected: { result: fail } }
  - { assertion_id: vf002_failed_measurement_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: MEASUREMENT_FAILED, producer_operation: CaptureMeasurement }, expected: { count: 1 } }
  - { assertion_id: vf002_no_passing_measurement, assertion_type: event_not_emitted, severity: blocking, target: { event_type: MEASUREMENT_PASSED } }
  - { assertion_id: vf002_nonconformance_opened, assertion_type: event_emitted, severity: blocking, target: { event_type: NONCONFORMANCE_OPENED, producer_operation: OpenNonconformance }, expected: { count: 1 } }
  - { assertion_id: vf002_nc_linked_to_failed_measurement, assertion_type: record_field_equals, severity: blocking, target: { record_type: Nonconformance, alias: nonconformance_001 }, expected: { source_measurement: measurement_torque_failed } }
  - { assertion_id: vf002_nc_disposition_pending, assertion_type: record_state, severity: blocking, target: { record_type: Nonconformance, alias: nonconformance_001 }, expected: { status: disposition_pending } }
  - { assertion_id: vf002_containment_active, assertion_type: record_state, severity: blocking, target: { record_type: QualityContainmentAction, alias: containment_action_001 }, expected: { status: active } }
  - { assertion_id: vf002_containment_started, assertion_type: event_emitted, severity: blocking, target: { event_type: QUALITY_CONTAINMENT_STARTED, producer_operation: ActivateQualityContainment }, expected: { count: 1 } }
  - { assertion_id: vf002_affected_population_exists, assertion_type: record_exists, severity: blocking, target: { record_type: AffectedPopulation, alias: affected_population_001 } }
  # The safety property: an unremediated failed measurement must BLOCK run close (Contract Spec §16).
  # If the block logic were neutered, RunCloseCheck would emit RUN_CLOSE_CHECK_PASSED and these fail.
  - { assertion_id: vf002_close_check_blocked, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_CLOSE_CHECK_BLOCKED, producer_operation: RunCloseCheck }, expected: { count: 1 } }
  - { assertion_id: vf002_close_never_passed, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_CLOSE_CHECK_PASSED } }
  - { assertion_id: vf002_run_close_blocked, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { status: close_blocked } }
  - { assertion_id: vf002_run_not_closed, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_CLOSED } }
  - { assertion_id: vf002_serial_history_has_failure, assertion_type: projection_contains, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001" }, expected: { event_types: [MEASUREMENT_FAILED, NONCONFORMANCE_OPENED] } }
