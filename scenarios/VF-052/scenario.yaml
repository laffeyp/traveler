scenario_id: VF-052
scenario_version: "1"
title: Non-production two-station presentation writes a conflicted Presentation
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Locks cross-driver equivalence on the non-production conflict path (boundary-spec-v0.10 §12.1). Under a
  production_install purpose, the second PresentInventoryAtStation refuses at emit (VF-041 already tests
  that). Under a non-production purpose (receiving_review here), the handler records a Presentation in
  state 'conflicted' and emits PRESENTATION_CONFLICT_DETECTED, rather than refusing. The backend index
  is purpose-aware: it enforces the invariant only for production purposes, so the record-conflict path
  writes on both drivers.

seed:
  deterministic_seed: 3047

clock:
  start_at: "2026-08-28T14:00:00Z"
  timezone: "UTC"
  mode: controlled

