scenario_id: VF-003D
scenario_version: "1"
title: Accepted machine evidence is later invalidated, staleing the run's report
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  The deferred VF-003D (Contract Spec §18 reconciliation), now built beyond the original slice (see ADDITIONS.md).
  A run closes with a controlled_export RunCloseReport; a piece of machine evidence for the run is accepted, then
  later INVALIDATED (a superseding correction). InvalidateAcceptedEvidence moves the evidence accepted ->
  invalidated (refused from any other state) and CASCADES: the run's generated report becomes
  regeneration_required (reconciliation_resolution_affecting_run). A GetReport read then SURFACES the staleness
  fail-closed — a stale controlled_export is not read as fresh. Proves the §18 accepted-evidence-invalidation
  cascade + the read-time freshness check on both drivers.

seed: { deterministic_seed: 30003 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner,                product_caller_type: planner }
  - { actor_id: operator_1, actor_type: operator,              product_caller_type: operator }
  - { actor_id: quality_1, actor_type: quality_engineer,       product_caller_type: quality_engineer }
  - { actor_id: machine_adapter_1, actor_type: adapter,        product_caller_type: adapter }
  - { actor_id: report_worker_1, actor_type: system_worker,    product_caller_type: system_worker }

aliases:
