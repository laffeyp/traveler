  - { step_id: "002", actor: mfg_eng_1, operation: SubmitProcedureVersionForReview, idempotency_key: vf003d-002, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] } }
  - { step_id: "003", actor: mfg_eng_1, operation: ReleaseProcedureVersion, idempotency_key: vf003d-003, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_RELEASED] } }
  - { step_id: "004", actor: mfg_eng_1, operation: CreateManufacturingStructureVersion, idempotency_key: vf003d-004, input: { manufacturing_structure_alias: manufacturing_structure_v1, part_revision: valve_body_rev_a }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_CREATED] } }
  - { step_id: "005", actor: mfg_eng_1, operation: ReleaseManufacturingStructureVersion, idempotency_key: vf003d-005, input: { manufacturing_structure_alias: manufacturing_structure_v1 }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_RELEASED] } }
  - { step_id: "006", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf003d-006, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "007", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf003d-007, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "008", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf003d-008, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "009", actor: planner_1, operation: ReserveInventory, idempotency_key: vf003d-009, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "010", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf003d-010, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "011", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf003d-011, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "012", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf003d-012, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  - { step_id: "013", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf003d-013, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_PASSED] } }
  - { step_id: "014", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf003d-014, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "015", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf003d-015, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_READY] } }
  - { step_id: "016", set_time: "2026-06-29T08:12:00Z", actor: operator_1, operation: StartRun, idempotency_key: vf003d-016, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_STARTED] } }
  - { step_id: "017", actor: operator_1, operation: StartRunStep, idempotency_key: vf003d-017, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_STARTED] } }
  - { step_id: "018", set_time: "2026-06-29T08:17:00Z", actor: operator_1, operation: CaptureMeasurement, idempotency_key: vf003d-018, input: { run_alias: run_001, run_step_alias: run_step_torque, data_collection_field_alias: data_field_torque, measurement_alias: measurement_torque_passed, value: 11.1, unit: Nm, source_type: operator_entry, captured_at: "2026-06-29T08:17:00Z" }, expect: { operation_succeeded: true, events_emitted: [MEASUREMENT_CAPTURED, MEASUREMENT_EVALUATED, MEASUREMENT_PASSED] } }
  - { step_id: "019", actor: operator_1, operation: CompleteRunStep, idempotency_key: vf003d-019, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_COMPLETED] } }
  - { step_id: "020", actor: operator_1, operation: CompleteRunSteps, idempotency_key: vf003d-020, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_COMPLETED] } }
  - { step_id: "021", set_time: "2026-06-29T08:45:00Z", actor: operator_1, operation: AttemptRunClose, idempotency_key: vf003d-021, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_ENTERED_CLOSE_CHECK] } }
  - { step_id: "022", actor: report_worker_1, operation: RunCloseCheck, idempotency_key: vf003d-022, input: { run_alias: run_001, run_close_check_alias: run_close_check_001, expected_result: passed }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_CHECK_STARTED, RUN_CLOSE_CHECK_PASSED] } }
  - { step_id: "023", actor: report_worker_1, operation: RequestRunCloseReport, idempotency_key: vf003d-023, input: { run_alias: run_001, run_close_check_alias: run_close_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_REPORT_REQUESTED] } }
  - { step_id: "024", set_time: "2026-06-29T08:47:00Z", actor: report_worker_1, operation: GenerateRunCloseReport, idempotency_key: vf003d-024, input: { report_alias: run_close_report_001, report_type: RunCloseReport, run_alias: run_001, run_close_check_alias: run_close_check_001, report_definition_version: 1, generated_at: "2026-06-29T08:47:00Z", access_scope: customer_summary_access }, expect: { operation_succeeded: true, events_emitted: [REPORT_REQUESTED, REPORT_GENERATION_STARTED, REPORT_GENERATED] } }
  - { step_id: "025", set_time: "2026-06-29T08:48:00Z", actor: report_worker_1, operation: ApplyRunCloseResultToRun, idempotency_key: vf003d-025, input: { run_alias: run_001, run_close_check_alias: run_close_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSED] } }
  # Machine evidence for the run is received, normalized, linked, and ACCEPTED.
  - { step_id: "026", set_time: "2026-06-29T08:50:00Z", actor: machine_adapter_1, operation: ReceiveMachineEvidence, idempotency_key: vf003d-026, input: { alias: torque_evidence_001, machine_alias: torque_tool_001, adapter_alias: machine_adapter_1, payload_type: torque_trace, occurred_at: "2026-06-29T08:50:00Z", received_at: "2026-06-29T08:51:00Z", payload: { serial_number: "VB-001", measured_torque_nm: 11.1 } }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_RECEIVED] } }
  - { step_id: "027", actor: report_worker_1, operation: NormalizeMachineEvidence, idempotency_key: vf003d-027, input: { evidence_alias: torque_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_NORMALIZED] } }
  - { step_id: "028", actor: report_worker_1, operation: LinkMachineEvidence, idempotency_key: vf003d-028, input: { evidence_alias: torque_evidence_001, run_alias: run_001, serial_number: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_LINKED] } }
  - { step_id: "029", set_time: "2026-06-29T08:55:00Z", actor: quality_1, operation: AcceptMachineEvidence, idempotency_key: vf003d-029, input: { evidence_alias: torque_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_ACCEPTED] } }
  # A superseding correction: the accepted evidence is INVALIDATED, cascading to stale the run's report.
  - { step_id: "030", set_time: "2026-06-29T10:00:00Z", actor: quality_1, operation: InvalidateAcceptedEvidence, idempotency_key: vf003d-030, input: { evidence_alias: torque_evidence_001, run_alias: run_001, reason: superseding_measurement_correction }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_INVALIDATED] } }
  - { step_id: "031", set_time: "2026-06-29T10:01:00Z", actor: report_worker_1, operation: GetReport, idempotency_key: vf003d-031, input: { report_alias: run_close_report_001 }, expect: { operation_succeeded: true } }

assertions:
  # Evidence was accepted, then invalidated (accepted -> invalidated, terminal).
  - { assertion_id: vf003d_accepted_before, assertion_type: record_state, severity: blocking, target: { record_type: MachineEvidenceRecord, alias: torque_evidence_001, checkpoint: after_step_029 }, expected: { state: accepted } }
  - { assertion_id: vf003d_invalidated, assertion_type: record_state, severity: blocking, target: { record_type: MachineEvidenceRecord, alias: torque_evidence_001 }, expected: { state: invalidated } }
  - { assertion_id: vf003d_invalidated_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: MACHINE_EVIDENCE_INVALIDATED, producer_operation: InvalidateAcceptedEvidence }, expected: { count: 1 } }
  # The cascade staled the run's report — regeneration_required, with the reconciliation reason.
  - { assertion_id: vf003d_report_stale, assertion_type: record_field_equals, severity: blocking, target: { record_type: GeneratedReport, alias: run_close_report_001 }, expected: { regeneration_required: true } }
  - { assertion_id: vf003d_report_stale_reason, assertion_type: record_field_equals, severity: blocking, target: { record_type: GeneratedReport, alias: run_close_report_001 }, expected: { regeneration_reason: reconciliation_resolution_affecting_run } }
  # The invalidate op and the GetReport read both succeeded.
  - { assertion_id: vf003d_invalidate_ok, assertion_type: operation_succeeded, severity: blocking, target: { step_id: "030", operation: InvalidateAcceptedEvidence }, expected: { succeeded: true } }
  - { assertion_id: vf003d_getreport_ok, assertion_type: operation_succeeded, severity: blocking, target: { step_id: "031", operation: GetReport }, expected: { succeeded: true } }
  # GetReport's RETURNED output surfaces the staleness fail-closed (not just the record field).
  - { assertion_id: vf003d_getreport_surfaces_stale, assertion_type: operation_output_contains, severity: blocking, target: { step_id: "031", operation: GetReport }, expected: { regeneration_required: true, regeneration_reason: reconciliation_resolution_affecting_run } }
