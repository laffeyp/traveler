scenario_id: VF-003B
scenario_version: "1"
title: Machine evidence rejected after review
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Machine-evidence variant (Harness §20, Contract Spec §23). Torque-tool evidence is received, normalized,
  linked, routed to review, and REJECTED after review (review_required -> rejected). Proves: rejected
  evidence reaches the rejected terminal state; it cannot support production truth (no MEASUREMENT_PASSED
  from evidence); the reject event carries the evidence foreign key.

