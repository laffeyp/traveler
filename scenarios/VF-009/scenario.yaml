scenario_id: VF-009
scenario_version: "1"
title: Access-filtered serial history
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  First-slice bench VF-009 (Harness §17/§19/§22): access-filtered serial history. ONE serial (VB-001) is
  built through machine-evidence review and run close, then its SerialHistory is read under two access
  profiles. Per Contract Spec §19 ("access evaluated at projection read; outputs full | summary | denied")
  and projections.yaml (SerialHistory is the only access_filterable projection), the SAME serial reads
  DIFFERENTLY by reader: a full-access read SEES the controlled machine-evidence detail
  (controlled_machine_evidence_payload); the customer_summary_access read does NOT — while the summary-safe
  spine (RUN_CLOSED, the machine-evidence review STATUS, the passing measurement) survives. Reader access is
  the only variable. The controlled/summary-safe filter predicate is B-Q-20. This exercises the previously
  access-BLIND serialHistory + the unimplemented access_full/access_summary assertion evaluators (Harness §11
  actorContext on readProjection) — the VF-003A dynamic on the whole access-read path.

seed: { deterministic_seed: 30090 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: machine_owner_1, actor_type: machine_integration_owner, product_caller_type: machine_integration_owner }
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner,                product_caller_type: planner }
  - { actor_id: operator_1, actor_type: operator,              product_caller_type: operator }
  - { actor_id: quality_1, actor_type: quality_engineer,       product_caller_type: quality_engineer }
  - { actor_id: machine_adapter_1, actor_type: adapter,        product_caller_type: adapter }
  - { actor_id: report_worker_1, actor_type: system_worker,    product_caller_type: system_worker }
  - { actor_id: customer_viewer_1, actor_type: support_user, product_caller_type: support_user, access_profile: customer_summary_access }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  valve_body_001: InventoryItem
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
  effectivity_resolution_001: EffectivityResolution
  build_check_001: BuildCheckResult
  run_001: Run
  run_context_snapshot_001: RunContextSnapshot
  run_step_torque: RunStep
  measurement_torque_passed: Measurement
  torque_evidence_001: MachineEvidenceRecord
  run_close_check_001: RunCloseCheck
  run_close_report_001: GeneratedReport

world:
  factory_node: node_la_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  machines:
    - { alias: torque_tool_001, machine_type: torque_tool, adapter: machine_adapter_1 }
  inventory_truth:
    - { alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

steps:
  # Equipment is registered before it can report anything. Evidence names its machine and adapter by
  # RESOLVED reference, so an unregistered tool cannot file a reading (B-Q-73).
  - { step_id: "000a", actor: machine_owner_1, operation: RegisterMachine, idempotency_key: vf009-reg-tt-001, input: { machine_alias: torque_tool_001, machine_id: "TT-001", name: "Torque tool 1", machine_type: torque_tool }, expect: { operation_succeeded: true, events_emitted: [MACHINE_REGISTERED] } }
  - { step_id: "000b", actor: machine_owner_1, operation: RegisterMachineAdapter, idempotency_key: vf009-reg-machine_adapter_1, input: { adapter_alias: machine_adapter_1, adapter_id: "AD-TT-001", machine_alias: torque_tool_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_ADAPTER_REGISTERED] } }
  - { step_id: "001", set_time: "2026-06-29T08:01:00Z", actor: mfg_eng_1, operation: CreateProcedureVersion, idempotency_key: vf009-001, input: { procedure_version_alias: procedure_version_v1, steps: [ { alias: procedure_step_torque, ordinal: 1, name: "Capture torque", data_collection_fields: [ { alias: data_field_torque, name: "Valve body torque", unit: Nm, lower_bound: 10.0, upper_bound: 12.0, nominal: 11.0, evaluation_mode: synchronous } ] } ] }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_CREATED] } }
  - { step_id: "002", actor: mfg_eng_1, operation: SubmitProcedureVersionForReview, idempotency_key: vf009-002, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] } }
  - { step_id: "003", actor: mfg_eng_1, operation: ReleaseProcedureVersion, idempotency_key: vf009-003, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_RELEASED] } }
  - { step_id: "004", actor: mfg_eng_1, operation: CreateManufacturingStructureVersion, idempotency_key: vf009-004, input: { manufacturing_structure_alias: manufacturing_structure_v1, part_revision: valve_body_rev_a }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_CREATED] } }
  - { step_id: "005", actor: mfg_eng_1, operation: ReleaseManufacturingStructureVersion, idempotency_key: vf009-005, input: { manufacturing_structure_alias: manufacturing_structure_v1 }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_RELEASED] } }
  - { step_id: "006", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf009-006, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "007", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf009-007, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "008", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf009-008, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "009", actor: planner_1, operation: ReserveInventory, idempotency_key: vf009-009, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "010", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf009-010, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "011", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf009-011, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "012", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf009-012, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  - { step_id: "013", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf009-013, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_PASSED] } }
  - { step_id: "014", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf009-014, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "015", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf009-015, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_READY] } }
  - { step_id: "016", set_time: "2026-06-29T08:12:00Z", actor: operator_1, operation: StartRun, idempotency_key: vf009-016, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_STARTED] } }
  - { step_id: "017", actor: operator_1, operation: StartRunStep, idempotency_key: vf009-017, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_STARTED] } }
  - { step_id: "018", set_time: "2026-06-29T08:17:00Z", actor: operator_1, operation: CaptureMeasurement, idempotency_key: vf009-018-pass, input: { run_alias: run_001, run_step_alias: run_step_torque, data_collection_field_alias: data_field_torque, measurement_alias: measurement_torque_passed, value: 11.1, unit: Nm, source_type: operator_entry, captured_at: "2026-06-29T08:17:00Z" }, expect: { operation_succeeded: true, events_emitted: [MEASUREMENT_CAPTURED, MEASUREMENT_EVALUATED, MEASUREMENT_PASSED] } }
  - { step_id: "019", actor: operator_1, operation: CompleteRunStep, idempotency_key: vf009-019, input: { run_alias: run_001, run_step_alias: run_step_torque }, expect: { operation_succeeded: true, events_emitted: [RUN_STEP_COMPLETED] } }
  - { step_id: "020", set_time: "2026-06-29T08:40:00Z", actor: machine_adapter_1, operation: ReceiveMachineEvidence, idempotency_key: vf009-020, input: { alias: torque_evidence_001, machine_alias: torque_tool_001, adapter_alias: machine_adapter_1, payload_type: torque_trace, occurred_at: "2026-06-29T08:34:30Z", received_at: "2026-06-29T08:40:00Z", payload: { serial_number: "VB-001", tool_id: "TT-001", measured_torque_nm: 11.1, trace_quality: acceptable } }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_RECEIVED] } }
  - { step_id: "021", actor: report_worker_1, operation: NormalizeMachineEvidence, idempotency_key: vf009-021, input: { evidence_alias: torque_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_NORMALIZED] } }
  - { step_id: "022", actor: report_worker_1, operation: LinkMachineEvidence, idempotency_key: vf009-022, input: { evidence_alias: torque_evidence_001, run_alias: run_001, serial_number: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_LINKED] } }
  - { step_id: "023", actor: quality_1, operation: RouteMachineEvidenceForReview, idempotency_key: vf009-023, input: { evidence_alias: torque_evidence_001 }, expect: { operation_succeeded: true, events_emitted: [MACHINE_EVIDENCE_REVIEW_REQUIRED] } }
  - { step_id: "024", actor: operator_1, operation: CompleteRunSteps, idempotency_key: vf009-024, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_COMPLETED] } }
  - { step_id: "025", set_time: "2026-06-29T08:45:00Z", actor: operator_1, operation: AttemptRunClose, idempotency_key: vf009-025, input: { run_alias: run_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_ENTERED_CLOSE_CHECK] } }
  - { step_id: "026", actor: report_worker_1, operation: RunCloseCheck, idempotency_key: vf009-026, input: { run_alias: run_001, run_close_check_alias: run_close_check_001, expected_result: passed }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_CHECK_STARTED, RUN_CLOSE_CHECK_PASSED] } }
  - { step_id: "027", actor: report_worker_1, operation: RequestRunCloseReport, idempotency_key: vf009-027, input: { run_alias: run_001, run_close_check_alias: run_close_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSE_REPORT_REQUESTED] } }
  - { step_id: "028", set_time: "2026-06-29T09:07:00Z", actor: report_worker_1, operation: GenerateRunCloseReport, idempotency_key: vf009-028, input: { report_alias: run_close_report_001, report_type: RunCloseReport, run_alias: run_001, run_close_check_alias: run_close_check_001, report_definition_version: 1, generated_at: "2026-06-29T09:07:00Z" }, expect: { operation_succeeded: true, events_emitted: [REPORT_REQUESTED, REPORT_GENERATION_STARTED, REPORT_GENERATED] } }
  - { step_id: "029", set_time: "2026-06-29T09:08:00Z", actor: report_worker_1, operation: ApplyRunCloseResultToRun, idempotency_key: vf009-029, input: { run_alias: run_001, run_close_check_alias: run_close_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_CLOSED] } }

# Post-scenario assertions: read the SAME serial (VB-001) under two access profiles.
assertions:
  - { assertion_id: vf009_run_closed, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { state: closed } }
  # FULL access SEES the controlled machine-evidence detail + the summary-safe spine.
  - { assertion_id: vf009_full_sees_controlled, assertion_type: access_full, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001" }, expected: { view: full, visible_detail_contains: [controlled_machine_evidence_payload], event_types_contain: [RUN_CLOSED, MACHINE_EVIDENCE_REVIEW_REQUIRED, MEASUREMENT_PASSED] } }
  # SUMMARY access does NOT see the same controlled marker (proven present under full above)...
  - { assertion_id: vf009_summary_hides_controlled, assertion_type: access_summary, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001", access_profile: customer_summary_access }, expected: { view: summary, visible_detail_not_contains: [controlled_machine_evidence_payload] } }
  # ...while the summary-safe spine (close, review STATUS, passing measurement) survives — filtered, not emptied.
  - { assertion_id: vf009_summary_keeps_spine, assertion_type: access_summary, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001", access_profile: customer_summary_access }, expected: { view: summary, event_types_contain: [RUN_CLOSED, MACHINE_EVIDENCE_REVIEW_REQUIRED, MEASUREMENT_PASSED] } }
  # A PRESENTED but unresolvable profile (revoked/typo'd credential) FAILS CLOSED — denied, not full. The
  # serial history must never leak controlled detail to a credential that does not resolve (Contract Spec §19).
  - { assertion_id: vf009_unresolvable_profile_denied, assertion_type: access_denied, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001", access_profile: revoked_credential }, expected: { view: denied } }
