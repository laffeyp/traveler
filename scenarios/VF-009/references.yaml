scenario_id: VF-009
scenario_version: "1"
registry_version: contracts-0.4.1
source: Harness Spec v0.1.2 §11/§17/§19/§22 (VF-009 access-filtered serial history) + Contract Spec §14.2/§19 + projections.yaml
note: >
  Reference manifest for VF-009 (access-filtered serial history). Introduces no new event type; its purpose
  is the B-Q-16 discipline and to record that VF-009 exercises the previously access-BLIND SerialHistory
  read path (Harness §11 actorContext on readProjection) + the access_full/access_summary assertion
  evaluators (scenario-assertions.yaml, previously unimplemented). Machine-evidence + run-close events supply
  the controlled + summary-safe entries the full/summary views discriminate on.

