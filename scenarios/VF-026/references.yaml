scenario_id: VF-026
scenario_version: "1"
registry_version: contracts-0.4.1
source: >
  Receiving Evidence Boundary Specification v0.1 §16 (VF-026: material test report mismatch blocks release)
  and §9.5 (the mismatch invariant). The first scenario in the §13 pack to be built with the id the
  specification assigns it — VF-024 and VF-025 already matched; the five that had drifted were renumbered
  to VF-031..VF-034 on 2026-07-31 (B-Q-58) precisely so this id was free for its own content.
note: >
  Brings the certificate verification lifecycle into the schema-generation set: CERTIFICATE_VERIFIED and
  CERTIFICATE_REJECTED had no generated payload schema until this scenario was materialized.

operations:
  - CreateInventoryItem
  - CreateShipment
  - AddShipmentLine
  - ReceiveShipment
  - ReceiveInventory
  - CaptureCertificate
  - AcceptCertificateAsEvidence
  - RejectCertificateAsEvidence
  - RunReceivingCheck
  - ApplyReceivingCheckResultToInventory

events:
  - INVENTORY_CREATED
  - SHIPMENT_CREATED
  - SHIPMENT_LINE_CREATED
  - SHIPMENT_RECEIVED
  - INVENTORY_RECEIVED
  - CERTIFICATE_CAPTURED
  - CERTIFICATE_VERIFIED
  - CERTIFICATE_REJECTED
  - RECEIVING_CHECK_STARTED
  - RECEIVING_CHECK_BLOCKED
  - INVENTORY_QUARANTINED

record_states:
  Shipment: [created, received]
  Certificate: [captured, verified, rejected]
  ReceivingCheck: [failed]
  InventoryItem: [expected, received, quarantined]

assertion_types:
  - record_state
  - record_field_equals
  - event_payload_contains
  - event_not_emitted
  - operation_failed
  - access_full
  - idempotent_replay # run by the harness replay pass, not as a post-assertion

projections:
  - SerialHistory

caller_types: [planner, quality_engineer]
