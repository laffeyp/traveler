scenario_id: VF-026
scenario_version: "1"
title: A material test report for the wrong heat cannot be verified, and the goods stay quarantined
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  boundary_spec: Receiving Evidence Boundary Specification v0.1 (§16 VF-026, §9.5 mismatch invariant)
  registry_version: contracts-0.4.1

purpose: >
  The boundary specification's §16. A supplier ships a valve body with a certificate of conformance that is
  correct and a mill test report that belongs to a different heat. Both documents are present, both are in
  date, and a check that only asked "is a material test report present?" would release the goods.

  The mismatch is caught at VERIFICATION, not at the check, because verification is the act of comparing the
  document against the material in front of you. The verifier states what the document should say; the
  certificate says something else; the operation is refused and the document is never marked as evidence. The
  receiving check then blocks on material_test_report_unverified — the document exists, so "absent" would be
  a lie, and unverified is the true fact about it.

  The CoC verifies normally in the same run. That contrast is the point: one document passes and one fails in
  the same consignment, so the scenario cannot pass by refusing everything.

seed:
  deterministic_seed: 3028

clock:
  start_at: "2026-07-09T08:00:00Z"
  timezone: "UTC"
  mode: controlled

world:
  factory_node: node_la_001
  station: station_receiving_01
  program: program_valve_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
  inventory_truth:
    - { alias: valve_body_009, part_revision: valve_body_rev_a, serial_number: VB-009 }
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

actors:
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: quality_1, actor_type: quality_engineer, product_caller_type: quality_engineer }

steps:
  - { step_id: "001", set_time: "2026-07-09T08:00:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf026-001, input: { inventory_alias: valve_body_009, part_revision: valve_body_rev_a, serial_number: "VB-009" }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "002", actor: planner_1, operation: CreateShipment, idempotency_key: vf026-002, input: { shipment_alias: shipment_001, supplier: supplier_acme, purchase_order_ref: "PO-6620" }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_CREATED] } }
  # Both documents are required for release, so the scenario can show one satisfying its rule and one not.
  - { step_id: "003", actor: planner_1, operation: AddShipmentLine, idempotency_key: vf026-003, input: { shipment_alias: shipment_001, shipment_line_alias: shipment_line_valve_body, inventory_item_alias: valve_body_009, part_revision: valve_body_rev_a, serial_or_lot: "VB-009", required_documents: [certificate_of_conformance, material_test_report] }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_LINE_CREATED] } }
  - { step_id: "004", set_time: "2026-07-09T08:05:00Z", actor: planner_1, operation: ReceiveShipment, idempotency_key: vf026-004, input: { shipment_alias: shipment_001 }, expect: { operation_succeeded: true, events_emitted: [SHIPMENT_RECEIVED] } }
  - { step_id: "005", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf026-005, input: { inventory_alias: valve_body_009 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "006", set_time: "2026-07-09T08:10:00Z", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf026-006, input: { certificate_alias: coc_vb009, cert_type: certificate_of_conformance, part_revision: valve_body_rev_a, serial_or_lot: "VB-009", cage_code: "1ABC2", expires_at: "2027-06-01T00:00:00Z" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  # The mill test report is filed against the delivered serial by its own account, but it names a different
  # CAGE code: it came from another mill entirely, and the delivered heat is not the one it certifies.
  - { step_id: "007", actor: planner_1, operation: CaptureCertificate, idempotency_key: vf026-007, input: { certificate_alias: mtr_vb009, cert_type: material_test_report, part_revision: valve_body_rev_a, serial_or_lot: "VB-009", cage_code: "9ZZZ9" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_CAPTURED] } }
  - { step_id: "008", set_time: "2026-07-09T08:20:00Z", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf026-008, input: { certificate_alias: coc_vb009, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-009", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_VERIFIED] } }
  # The verification is REFUSED: the inspector expects the approved mill's CAGE code and the document carries
  # another. Nothing is written — the document does not become evidence, and no CERTIFICATE_VERIFIED is emitted.
  - { step_id: "009", set_time: "2026-07-09T08:25:00Z", actor: quality_1, operation: AcceptCertificateAsEvidence, idempotency_key: vf026-009, input: { certificate_alias: mtr_vb009, expected_part_revision: valve_body_rev_a, expected_serial_or_lot: "VB-009", expected_cage_code: "1ABC2" }, expect: { operation_succeeded: false, failure_class: supplier_document_mismatch } }
  - { step_id: "010", set_time: "2026-07-09T08:30:00Z", actor: quality_1, operation: RejectCertificateAsEvidence, idempotency_key: vf026-010, input: { certificate_alias: mtr_vb009, reason: "mill test report is from CAGE 9ZZZ9, not the approved source 1ABC2" }, expect: { operation_succeeded: true, events_emitted: [CERTIFICATE_REJECTED] } }
  - { step_id: "011", set_time: "2026-07-09T08:35:00Z", actor: quality_1, operation: RunReceivingCheck, idempotency_key: vf026-011, input: { shipment_line_alias: shipment_line_valve_body, receiving_check_alias: receiving_check_001 }, expect: { operation_succeeded: true, events_emitted: [RECEIVING_CHECK_STARTED, RECEIVING_CHECK_BLOCKED] } }
  - { step_id: "012", set_time: "2026-07-09T08:40:00Z", actor: quality_1, operation: ApplyReceivingCheckResultToInventory, idempotency_key: vf026-012, input: { receiving_check_alias: receiving_check_001, inventory_item_alias: valve_body_009 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_QUARANTINED] } }

assertions:
  - { assertion_id: vf026_coc_verified, assertion_type: record_state, severity: blocking, target: { record_type: Certificate, alias: coc_vb009 }, expected: { state: verified } }
  - { assertion_id: vf026_mtr_rejected, assertion_type: record_state, severity: blocking, target: { record_type: Certificate, alias: mtr_vb009 }, expected: { state: rejected } }
  - { assertion_id: vf026_mismatch_refused, assertion_type: operation_failed, severity: blocking, target: { step_id: "009", operation: AcceptCertificateAsEvidence }, expected: { failure_class: supplier_document_mismatch } }
  # The blocker names the true fact. The document is PRESENT, so material_test_report_present would be a lie;
  # it is unverified, and that is its own registered rule id precisely so the two cannot be confused.
  - { assertion_id: vf026_blocked_on_unverified_not_absent, assertion_type: event_payload_contains, severity: blocking, target: { event_type: RECEIVING_CHECK_BLOCKED, producer_operation: RunReceivingCheck }, expected: { blockers: [material_test_report_unverified] } }
  - { assertion_id: vf026_check_blocked, assertion_type: record_state, severity: blocking, target: { record_type: ReceivingCheck, alias: receiving_check_001 }, expected: { state: blocked } }
  - { assertion_id: vf026_goods_quarantined, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_009 }, expected: { state: quarantined } }
  - { assertion_id: vf026_never_released, assertion_type: event_not_emitted, severity: blocking, target: { event_type: INVENTORY_AVAILABLE }, expected: { reason: the_mill_test_report_was_never_verified } }
  # Discrimination without new vocabulary: if the mismatch guard were inert, step 009 would SUCCEED and the
  # mill test report would end `verified` rather than `rejected`. Two existing assertions already carry that,
  # so no event-count primitive is needed — the boundary spec's §7.5 asks for new ones only if necessary.
  - { assertion_id: vf026_serial_history_shows_the_refusal, assertion_type: access_full, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-009" }, expected: { view: full, event_types_contain: [SHIPMENT_RECEIVED, INVENTORY_RECEIVED, CERTIFICATE_REJECTED, RECEIVING_CHECK_BLOCKED, INVENTORY_QUARANTINED] } }

idempotency_replay_checks:
  - check_id: vf026_replay_receiving_check
    step_id: "011"
    operation: RunReceivingCheck
    idempotency_key: vf026-011
