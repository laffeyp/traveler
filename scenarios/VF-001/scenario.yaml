scenario_id: VF-001
scenario_version: "1"
title: Happy path serial build
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  Prove the clean production spine (Product Spec §14): released procedure + structure, effectivity,
  build check, serialized run, PASSING measurement, serialized install, and a run that closes on the
  FIRST close check with no nonconformance and no block. The negative space (no MEASUREMENT_FAILED,
  no NONCONFORMANCE_OPENED, no RUN_CLOSE_CHECK_BLOCKED) is what distinguishes this from VF-003.

seed: { deterministic_seed: 3001 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner, product_caller_type: planner }
  - { actor_id: operator_1, actor_type: operator, product_caller_type: operator }
  - { actor_id: report_worker_1, actor_type: system_worker, product_caller_type: system_worker }
  - { actor_id: customer_viewer_1, actor_type: access_limited_external_viewer, product_caller_type: support_user, access_profile: customer_summary_access }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  procedure_step_install_gasket: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  bom_line_gasket: BOMLine
  valve_body_001: InventoryItem
  gasket_001: InventoryItem
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
  effectivity_resolution_001: EffectivityResolution
  build_check_001: BuildCheckResult
  run_001: Run
  run_context_snapshot_001: RunContextSnapshot
  run_step_torque: RunStep
  run_step_install_gasket: RunStep
  measurement_torque_passed: Measurement
  installation_event_001: InstallationEvent
  run_close_check_001: RunCloseCheck
  run_close_report_001: GeneratedReport

world:
  access_policies:
    - alias: customer_summary_access
      visible: [RunCloseReport.summary, SerialHistory.summary, BoundedDrillDown.summary]
      hidden: [controlled_machine_evidence_payload, internal_quality_notes, raw_machine_payload]

steps:
