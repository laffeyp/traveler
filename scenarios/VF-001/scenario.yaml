  - { assertion_id: vf001_serial_history_has_clean_chain, assertion_type: projection_contains, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001" }, expected: { event_types: [MEASUREMENT_PASSED, INVENTORY_INSTALLED, RUN_CLOSED] } }
  - { assertion_id: vf001_serial_history_has_no_failures, assertion_type: projection_not_contains, severity: blocking, target: { projection: SerialHistory, key_serial: "VB-001" }, expected: { event_types: [MEASUREMENT_FAILED, NONCONFORMANCE_OPENED, RUN_CLOSE_CHECK_BLOCKED] } }
  - { assertion_id: vf001_bounded_drill_down_filtered, assertion_type: bounded_drill_down_filtered, severity: blocking, target: { operation: BoundedDrillDown, actor: customer_viewer_1 }, expected: { hidden: [raw_machine_payload, controlled_machine_evidence_payload, internal_quality_notes] } }
