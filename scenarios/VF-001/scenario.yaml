  - { step_id: "022", actor: operator_1, operation: StartRunWithInventory, idempotency_key: vf001-022, input: { run_alias: run_001, inventory_aliases: [valve_body_001, gasket_001] }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_IN_WIP] } }
