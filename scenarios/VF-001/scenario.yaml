assertions:
  - { assertion_id: vf001_procedure_released, assertion_type: record_state, severity: blocking, target: { record_type: ProcedureVersion, alias: procedure_version_v1 }, expected: { status: released } }
  - { assertion_id: vf001_msv_released, assertion_type: record_state, severity: blocking, target: { record_type: ManufacturingStructureVersion, alias: manufacturing_structure_v1 }, expected: { status: released } }
  - { assertion_id: vf001_build_check_passed, assertion_type: record_field_equals, severity: blocking, target: { record_type: BuildCheckResult, alias: build_check_001 }, expected: { status: passed } }
  - { assertion_id: vf001_valve_body_in_wip, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: valve_body_001 }, expected: { status: in_wip } }
  - { assertion_id: vf001_gasket_installed, assertion_type: record_state, severity: blocking, target: { record_type: InventoryItem, alias: gasket_001 }, expected: { status: installed } }
  - { assertion_id: vf001_measurement_passed, assertion_type: record_field_equals, severity: blocking, target: { record_type: Measurement, alias: measurement_torque_passed }, expected: { result: pass } }
  - { assertion_id: vf001_one_measurement_passed, assertion_type: event_emitted, severity: blocking, target: { event_type: MEASUREMENT_PASSED, producer_operation: CaptureMeasurement }, expected: { count: 1 } }
  - { assertion_id: vf001_no_failed_measurement, assertion_type: event_not_emitted, severity: blocking, target: { event_type: MEASUREMENT_FAILED } }
  - { assertion_id: vf001_no_nonconformance, assertion_type: event_not_emitted, severity: blocking, target: { event_type: NONCONFORMANCE_OPENED } }
  - { assertion_id: vf001_close_never_blocked, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_CLOSE_CHECK_BLOCKED } }
  - { assertion_id: vf001_close_passed_first_time, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_CLOSE_CHECK_PASSED, producer_operation: RunCloseCheck }, expected: { count: 1 } }
  - { assertion_id: vf001_run_closed, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { status: closed } }
  - { assertion_id: vf001_run_closed_once, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_CLOSED, producer_operation: ApplyRunCloseResultToRun }, expected: { count: 1 } }
  - { assertion_id: vf001_report_generated, assertion_type: report_generated, severity: blocking, target: { report_type: RunCloseReport, alias: run_close_report_001 } }
  - { assertion_id: vf001_report_has_sections, assertion_type: report_payload_contains, severity: blocking, target: { report_type: RunCloseReport, alias: run_close_report_001 }, expected: { sections: [report_header, run_context, executed_steps, measurement_summary, installed_inventory, final_close_result] } }
