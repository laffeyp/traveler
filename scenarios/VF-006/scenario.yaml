scenario_id: VF-006
scenario_version: "1"
title: Missing child inventory blocks the build check
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  First-slice bench VF-006 (Harness §22): missing child inventory build check failure. The
  manufacturing structure's install_required BOM line (gasket_rev_b) has NO inventory candidate in
  the world. RunBuildCheck (Build Readiness §7.3 "verify required BOM inventory candidates exist")
  must produce BuildCheckResult.status == blocked and NAME the blocker as a missing-inventory
  blocker (Product Spec §212 "build checks name blockers") — not silently pass. ApplyBuildCheckResultToRun
  then drives the Run planned -> blocked (Contract Spec Run state machine: RUN_BLOCKED). Proves the
  build-check BLOCKED path, unexercised by VF-003 which only walks BUILD_CHECK_PASSED.

seed: { deterministic_seed: 30060 }
clock: { start_at: "2026-06-29T08:00:00Z", timezone: "UTC", mode: controlled }

actors:
  - { actor_id: mfg_eng_1, actor_type: manufacturing_engineer, product_caller_type: manufacturing_engineer }
  - { actor_id: planner_1, actor_type: planner,                product_caller_type: planner }
  - { actor_id: report_worker_1, actor_type: system_worker,    product_caller_type: system_worker }

aliases:
  procedure_version_v1: ProcedureVersion
  procedure_step_torque: ProcedureStep
  procedure_step_install_gasket: ProcedureStep
  data_field_torque: DataCollectionField
  manufacturing_structure_v1: ManufacturingStructureVersion
  bom_line_gasket: BOMLine
  valve_body_001: InventoryItem
  effectivity_rule_procedure: EffectivityRule
  effectivity_rule_structure: EffectivityRule
  effectivity_resolution_001: EffectivityResolution
  build_check_001: BuildCheckResult
  run_001: Run
  run_context_snapshot_001: RunContextSnapshot
  run_step_torque: RunStep
  run_step_install_gasket: RunStep

world:
  factory_node: node_la_001
  part_revisions:
    - { alias: valve_body_rev_a, part_number: VB-100, revision: A }
    - { alias: gasket_rev_b, part_number: GK-200, revision: B }
  # inventory_truth intentionally omits the gasket child: the BOM requires it, the world lacks it.
  inventory_truth:
    - { alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }
  access_policies: []

steps:
  - { step_id: "001", set_time: "2026-06-29T08:01:00Z", actor: mfg_eng_1, operation: CreateProcedureVersion, idempotency_key: vf006-001, input: { procedure_version_alias: procedure_version_v1, steps: [ { alias: procedure_step_torque, ordinal: 1, name: "Capture torque", data_collection_fields: [ { alias: data_field_torque, name: "Valve body torque", unit: Nm, lower_bound: 10.0, upper_bound: 12.0, nominal: 11.0, evaluation_mode: synchronous } ] }, { alias: procedure_step_install_gasket, ordinal: 2, name: "Install gasket", install_required: true } ] }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_CREATED] } }
  - { step_id: "002", actor: mfg_eng_1, operation: SubmitProcedureVersionForReview, idempotency_key: vf006-002, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] } }
  - { step_id: "003", actor: mfg_eng_1, operation: ReleaseProcedureVersion, idempotency_key: vf006-003, input: { procedure_version_alias: procedure_version_v1 }, expect: { operation_succeeded: true, events_emitted: [PROCEDURE_VERSION_RELEASED] } }
  - { step_id: "004", actor: mfg_eng_1, operation: CreateManufacturingStructureVersion, idempotency_key: vf006-004, input: { manufacturing_structure_alias: manufacturing_structure_v1, part_revision: valve_body_rev_a }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_CREATED] } }
  - { step_id: "005", actor: mfg_eng_1, operation: AddBOMLine, idempotency_key: vf006-005, input: { manufacturing_structure_alias: manufacturing_structure_v1, bom_line_alias: bom_line_gasket, part_revision: gasket_rev_b, install_required: true }, expect: { operation_succeeded: true, events_emitted: [BOM_LINE_CREATED] } }
  - { step_id: "006", actor: mfg_eng_1, operation: ReleaseManufacturingStructureVersion, idempotency_key: vf006-006, input: { manufacturing_structure_alias: manufacturing_structure_v1 }, expect: { operation_succeeded: true, events_emitted: [MANUFACTURING_STRUCTURE_RELEASED] } }
  - { step_id: "007", set_time: "2026-06-29T08:05:00Z", actor: planner_1, operation: CreateInventoryItem, idempotency_key: vf006-007, input: { inventory_alias: valve_body_001, part_revision: valve_body_rev_a, serial_number: VB-001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_CREATED] } }
  - { step_id: "008", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf006-008, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "009", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf006-009, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "010", actor: planner_1, operation: ReserveInventory, idempotency_key: vf006-010, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
  - { step_id: "011", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf006-011, input: { effectivity_rule_alias: effectivity_rule_procedure, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "012", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf006-012, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "013", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf006-013, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RESOLVED] } }
  # Build check: the install_required BOM line has no inventory candidate -> blocked, missing-inventory blocker named.
  - { step_id: "014", set_time: "2026-06-29T08:08:00Z", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf006-014, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_FAILED, BUILD_BLOCKER_CREATED] } }
  - { step_id: "015", set_time: "2026-06-29T08:10:00Z", actor: planner_1, operation: CreateRun, idempotency_key: vf006-015, input: { run_alias: run_001, run_context_snapshot_alias: run_context_snapshot_001, procedure_version_alias: procedure_version_v1, manufacturing_structure_alias: manufacturing_structure_v1, effectivity_resolution_alias: effectivity_resolution_001, build_check_alias: build_check_001, target_inventory_alias: valve_body_001, run_step_aliases: [run_step_torque, run_step_install_gasket] }, expect: { operation_succeeded: true, events_emitted: [RUN_CREATED] } }
  - { step_id: "016", actor: report_worker_1, operation: ApplyBuildCheckResultToRun, idempotency_key: vf006-016, input: { run_alias: run_001, build_check_alias: build_check_001 }, expect: { operation_succeeded: true, events_emitted: [RUN_BLOCKED] } }

assertions:
  - { assertion_id: vf006_build_check_blocked, assertion_type: record_field_equals, severity: blocking, target: { record_type: BuildCheckResult, alias: build_check_001 }, expected: { status: blocked } }
  - { assertion_id: vf006_missing_blocker_named, assertion_type: event_payload_contains, severity: blocking, target: { event_type: BUILD_BLOCKER_CREATED, producer_operation: RunBuildCheck }, expected: { blocker: "missing_bom_inventory:gasket_rev_b" } }
  - { assertion_id: vf006_build_check_failed_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: BUILD_CHECK_FAILED, producer_operation: RunBuildCheck }, expected: { count: 1 } }
  - { assertion_id: vf006_build_check_not_passed, assertion_type: event_not_emitted, severity: blocking, target: { event_type: BUILD_CHECK_PASSED } }
  - { assertion_id: vf006_run_blocked_state, assertion_type: record_state, severity: blocking, target: { record_type: Run, alias: run_001 }, expected: { state: blocked } }
  - { assertion_id: vf006_run_blocked_emitted, assertion_type: event_emitted, severity: blocking, target: { event_type: RUN_BLOCKED, producer_operation: ApplyBuildCheckResultToRun }, expected: { count: 1 } }
  - { assertion_id: vf006_run_never_ready, assertion_type: event_not_emitted, severity: blocking, target: { event_type: RUN_READY } }
