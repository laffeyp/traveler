scenario_id: VF-007
scenario_version: "1"
title: Ambiguous effectivity blocks the run
ci_eligible: true

contract_authority:
  contract_spec: Operation / Event / State Contract Specification v0.4.1
  harness_spec: Virtual Factory Harness Specification v0.1.2
  registry_version: contracts-0.4.1

purpose: >
  First-slice bench VF-007 (Harness §22/§19): ambiguous effectivity blocks the run. Two active
  serial_cut_in rules select DIFFERENT ProcedureVersions for the same serial at the SAME priority.
  Per Contract Spec §17 ("if multiple equal-priority matches exist for same target type, create
  ambiguity") and Harness §19 ("equal-priority match creates ambiguity"), ResolveEffectivity must NOT
  resolve and NOT throw — it produces an EffectivityResolution.status == ambiguous and emits the
  registered incident EFFECTIVITY_AMBIGUOUS (unexercised until now — the VF-003A dynamic; the engine
  previously threw). The unresolved effectivity then blocks the build check (sole blocker:
  effectivity_ambiguous — inventory is fully staged, so ambiguity is isolated as the cause) and the run
  goes planned -> blocked. The distinct "no required match fails resolution" outcome (Contract Spec §17;
  a separate Harness §19 test) is a hard fail (precondition_failed), covered at the unit level in
  tests/effectivity/effectivity.test.ts — not by this scenario.

