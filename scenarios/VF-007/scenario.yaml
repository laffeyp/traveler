  - { step_id: "013", actor: planner_1, operation: ReceiveInventory, idempotency_key: vf007-013, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RECEIVED] } }
  - { step_id: "014", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf007-014, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "015", actor: planner_1, operation: ReleaseInventory, idempotency_key: vf007-015, input: { inventory_alias: gasket_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_AVAILABLE] } }
  - { step_id: "016", actor: planner_1, operation: ReserveInventory, idempotency_key: vf007-016, input: { inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [INVENTORY_RESERVED] } }
