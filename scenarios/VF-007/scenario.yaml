  - { step_id: "017", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf007-017, input: { effectivity_rule_alias: effectivity_rule_procedure_a, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "018", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf007-018, input: { effectivity_rule_alias: effectivity_rule_procedure_b, target_record_type: ProcedureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: procedure_version_v1b, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  - { step_id: "019", actor: planner_1, operation: CreateEffectivityRule, idempotency_key: vf007-019, input: { effectivity_rule_alias: effectivity_rule_structure, target_record_type: ManufacturingStructureVersion, rule_type: serial_cut_in, serial_condition: "VB-001", target_alias: manufacturing_structure_v1, priority: 1 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_RULE_CREATED] } }
  # ResolveEffectivity: equal-priority PV matches -> ambiguity produced (NOT resolved, NOT thrown).
  - { step_id: "020", set_time: "2026-06-29T08:08:00Z", actor: planner_1, operation: ResolveEffectivity, idempotency_key: vf007-020, input: { effectivity_resolution_alias: effectivity_resolution_001, target_serial: "VB-001", target_inventory_alias: valve_body_001 }, expect: { operation_succeeded: true, events_emitted: [EFFECTIVITY_AMBIGUOUS] } }
  # Build check: unresolved (ambiguous) effectivity is the SOLE blocker (inventory is fully staged).
  - { step_id: "021", actor: planner_1, operation: RunBuildCheck, idempotency_key: vf007-021, input: { build_check_alias: build_check_001, target_inventory_alias: valve_body_001, effectivity_resolution_alias: effectivity_resolution_001 }, expect: { operation_succeeded: true, events_emitted: [BUILD_CHECK_STARTED, BUILD_CHECK_FAILED, BUILD_BLOCKER_CREATED] } }
