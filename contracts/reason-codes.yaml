registry: reason-codes
registry_version: contracts-0.4.1
source: specs/access-and-visibility/boundary-spec-v0.1.md §8.3
note: >
  Twenty-two reason codes an access decision can carry. Each is used at least once by an enforcement point
  (§7) or by the fail-closed mutation battery (`specs/access-and-visibility/registry-pack-v0.1/mutations/access-fail-closed-battery.yaml`).
  Reason codes ride on the AccessDecision record's `reason` field and on the ACCESS_DECISION_* event
  payloads. `allowed` is the code for a successful decision so audit records name their outcome uniformly.

  A reason code is a stable string. Sprint 033 registers them; sprints 035-052 emit them from handlers and
  assert on them from tests. A test in `tests/access/reason-codes-registered.test.ts` proves every §8.3
  name resolves here and every name here traces back to the spec.

reason_codes:
  - name: allowed
    spec_section: "§8.2"
    note: "the successful-decision code; every audited allow carries it"
  - name: role_not_authorized
    spec_section: "§8.3"
    used_by_sprint: deferred
    note: >
      Registered as the specific §14 name for the case the driver's operation-authorization wrapper
      currently emits generically as `authorization_denied`. Not yet a code path: unifying operation
      authorization with the §8 decision model is the deferred pass-in-part row 4 of
      `ACCESS_AND_VISIBILITY_ACCEPTANCE.md`. Kept in the registry so a future sprint that closes that row
      has the name to emit against; the ledger says "deferred" so the citation resolves honestly.
