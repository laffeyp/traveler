  - { name: StartRun, authorization_rule: run_execution, owning_module: run, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [RUN_STARTED] }
  - { name: PauseRun, authorization_rule: run_planning, owning_module: run, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [RUN_PAUSED] }
