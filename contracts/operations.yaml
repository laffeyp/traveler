  - { name: SupersedeManufacturingStructureVersion, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MANUFACTURING_STRUCTURE_SUPERSEDED] }
  - { name: RetireManufacturingStructureVersion, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MANUFACTURING_STRUCTURE_RETIRED] }

  # --- Effectivity Module ---
