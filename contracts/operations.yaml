  - { name: QuarantineMachineEvidence, authorization_rule: machine_evidence_review, owning_module: machine_evidence, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MACHINE_EVIDENCE_QUARANTINED] }
  - { name: AcceptMachineEvidence, authorization_rule: machine_evidence_review, owning_module: machine_evidence, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MACHINE_EVIDENCE_ACCEPTED] }
