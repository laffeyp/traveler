registry: operations
registry_version: contracts-0.4.1
source: Contract Spec v0.4.1 sections 12, 21.1, 22 + TAD v0.3 section 5 + Build Readiness Plan v0.2 section 7
note: >
  First-slice operation registry. owning_module is the single source of truth for ownership.
  events_emitted lists every event an operation may emit across its branches; the registry
  declares what is allowed, not what fires on a given run. vf003=true marks operations on the
  VF-003 trace. idempotency in {required_idempotency_key, derived_idempotency_key,
  transactional_unique_constraint, not_idempotent}.

operations:
  # --- Procedure Module ---
  - { name: CreateProcedureVersion, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: transactional_unique_constraint, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [PROCEDURE_VERSION_CREATED] }
  - { name: SubmitProcedureVersionForReview, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [PROCEDURE_VERSION_SUBMITTED] }
  - { name: ReturnProcedureVersionToDraft, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [PROCEDURE_VERSION_RETURNED] }
  - { name: ReleaseProcedureVersion, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [PROCEDURE_VERSION_RELEASED] }
  - { name: SupersedeProcedureVersion, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [PROCEDURE_VERSION_SUPERSEDED] }
  - { name: RetireProcedureVersion, authorization_rule: procedure_authoring, owning_module: procedure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [PROCEDURE_VERSION_RETIRED] }

