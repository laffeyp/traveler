  - { name: ScrapInventory, authorization_rule: inventory_disposition, owning_module: inventory, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [INVENTORY_SCRAPPED] }
