  - { name: StartRunStep, authorization_rule: run_execution, owning_module: run, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [RUN_STEP_STARTED] }
  - { name: BlockRunStep, authorization_rule: run_blocking, owning_module: run, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [RUN_STEP_BLOCKED] }
