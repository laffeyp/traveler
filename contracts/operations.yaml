  - { name: AddBOMLine, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: true, events_emitted: [BOM_LINE_CREATED] }
  - { name: UpdateDraftBOMLine, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [BOM_LINE_CHANGED] }
  - { name: SubmitManufacturingStructureForReview, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MANUFACTURING_STRUCTURE_SUBMITTED] }
  - { name: ReturnManufacturingStructureToDraft, authorization_rule: structure_authoring, owning_module: manufacturing_structure, exposure: [bff_exposed, internal], idempotency: required_idempotency_key, observability_ref: standard_mutating_operation_observability, compatibility_ref: standard_operation_v1_compatibility, vf003: false, events_emitted: [MANUFACTURING_STRUCTURE_RETURNED] }
