  - { name: presentation_not_active,       maps_to: state_transition_forbidden, new: false, spec_section: "PP §8", used_by_sprint: 094 }
  - { name: presentation_not_bound,        maps_to: state_transition_forbidden, new: false, spec_section: "PP §8", used_by_sprint: 094 }
