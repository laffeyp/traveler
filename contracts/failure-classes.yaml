  - { name: presentation_terminal,         maps_to: state_transition_forbidden, new: false, spec_section: "PP §8", used_by_sprint: 094 }
  - { name: presentation_conflict,         new: true,                                 spec_section: "PP §8", used_by_sprint: 094 }
  - { name: binding_forbidden_for_purpose, new: true,                                 spec_section: "PP §8", used_by_sprint: 094, note: "enforces the support_diagnostics narrowing in §4.2 through BindPresentedItemToRunStep" }
