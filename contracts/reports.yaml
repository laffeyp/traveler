registry: reports
registry_version: contracts-0.4.1
source: Contract Spec v0.4.1 section 15 + Build Readiness Plan v0.2 section 10
note: >
  RunCloseReport is the first governed report. Prior official reports are not silently overwritten.
  CertificateOfConformance is the outbound attestation that leaves with the goods. It is a governed report
  rather than a new subsystem because the machinery already fits: a definition version, a bound access scope,
  and supersession under a named trigger. AS9163/EN 9163 requires a revised certificate to carry a NEW
  distinguishable number, a revision reason and a new release date - which is REPORT_SUPERSEDED with a
  trigger, built for VF-012. Its required sections are the AS9163 minimum content (B-Q-46).

reports:
  - name: RunCloseReport
    owning_module: report
    report_definition_version: 1
    payload_schema_ref: schemas/reports/RunCloseReport.schema.json
    generated_by: GenerateRunCloseReport
    source_projections: [AsBuiltProjection, SerialHistory, RunCloseReadiness, ReportSourceIndex]
    source_records:
      [Run, RunContextSnapshot, ProcedureVersion, ManufacturingStructureVersion, RunStep,
       Measurement, MachineEvidenceRecord, Attachment, Nonconformance, AffectedPopulation,
       QualityContainmentAction, Disposition, ReworkRun, Verification, Redline,
       ApprovalDecision, InstallationEvent, RemovalEvent, RunCloseCheck, RunCloseObservation,
       Shipment, ShipmentLine, ReceivingCheck, Certificate]
    required_sections:
      [report_header, run_context, executed_steps, measurement_summary, quality_path,
       redline_history, installed_inventory, receiving_evidence_summary, machine_evidence_summary,
       run_close_observations, final_close_result, source_traceability, access_policy_snapshot]
    regeneration_required_after:
      [report_definition_change, reconciliation_resolution_affecting_run,
       access_policy_change_for_controlled_export, source_record_correction]

  - name: CertificateOfConformance
    owning_module: report
    report_definition_version: 1
    payload_schema_ref: schemas/reports/CertificateOfConformance.schema.json
    generated_by: GenerateCertificateOfConformance
    source_projections: [SerialHistory, AsBuiltProjection, ReportSourceIndex]
    source_records: [InventoryItem, Run, RunCloseCheck, GeneratedReport, Certificate, Verification]
    required_sections:
      [certificate_header, supplier, customer, purchase_order, items, conformity_statement,
       traceability, authorized_signature]
    regeneration_required_after:
      [report_definition_change, source_record_correction]

  # The boundary spec's §11.6. A governed report rather than a bare read model, because three of the four
  # unexercised fail-closed mutation arms are about a report going STALE after a policy change, being read at
  # the wrong depth, and being drilled into — and the report layer already carries the access_policy_snapshot,
  # the regeneration triggers and the supersession that those need. A read model would have meant building all
  # of it again under a different name (B-Q-71 closed).
  - name: SupplierEvidencePacket
    owning_module: report
    report_definition_version: 1
    payload_schema_ref: schemas/reports/SupplierEvidencePacket.schema.json
    generated_by: GenerateSupplierEvidencePacket
    source_projections: [SerialHistory, ReportSourceIndex]
    source_records: [Shipment, ShipmentLine, InventoryItem, Certificate, ReceivingCheck, Nonconformance]
    required_sections:
      [packet_header, shipment, shipment_lines, inventory_items, required_documents,
       attached_documents, verification_decisions, mismatches, access_filtering,
       final_receiving_status]
    regeneration_required_after:
      [report_definition_change, access_policy_change_for_controlled_export, source_record_correction]
