registry: modules
registry_version: contracts-0.4.1
source: TAD v0.3 section 5 (authoritative module ownership registry)
note: >
  Module identity registry. Ownership of each record / operation / event is recorded
  on the record / operation / event itself (single source of truth), which satisfies the
  "exactly one owning module" invariant by construction. first_slice=false modules are
  registered for identity but own no first-slice operations or events.

caller_types:
  - manufacturing_engineer
  - planner
  - operator
  - quality_engineer
  - machine_integration_owner
  - adapter
  - system_worker
  - access_admin
  - service_account
  - support_user

# Caller-type names published by other layers (visibility-profiles.yaml
# intended_audience, scenario actor_type notes, etc.) that the runtime does
# not authorize. Every name here is deferred to a boundary spec that will
# register it as a live caller_type when a scenario forces the move. Present
# here as a hard-filter allowlist so a typo in an intended_audience value
# fails validate:contracts loudly. F2b + handoff-A track 1 origin; F2e
# (2026-08-29) migrated to the record shape { name, note, next_phase } so a
# naked typo added to the allowlist itself has no note to write and no phase
# to name — closes the F2c allowlist-edge false-secure gap the Phase G ship
# review named.
deferred_caller_types:
  - name: external_viewer
    note: >
      F2 track 1 (2026-08-28) published `intended_audience: external_viewer` on
      `customer_summary_access` and `customer_extended_access` in
      `contracts/visibility-profiles.yaml`. The runtime routes those reads under
      `access_admin` at `src/driver/driver.ts:readRecordAsCaller`; the audit
      event carries `access_admin` as the caller identity. F2c added this
      allowlist so a typo in intended_audience fails validate:contracts
      (section 9b). F2e added this record shape so a typo in the allowlist
      itself fails (section 9c).
    next_phase: handoff-A track 2 — external_viewer caller_type registration; the sharpened trigger at ui-overlay-spec-v0.9.md § 16 fires when a downstream consumer of the audit trail needs per-customer attribution.

